<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <!-- Import chalk font -->
    <link href="https://fonts.googleapis.com/css2?family=Cabin+Sketch:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: transparent;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        h2 {
            font-family: 'Cabin Sketch', cursive, sans-serif;
            font-size: 42px;
            font-weight: 700;
            color: #F07167;
            margin-bottom: 10px;
        }

        p {
            font-size: 18px;
            color: #dddddd;
            max-width: 450px;
            line-height: 1.5;
        }

        /* Placeholder icon or image styling */
        .placeholder-icon {
            font-size: 60px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="placeholder-icon">📐</div>
    <h2>Welcome to Your Math Dashboard</h2>
    <p>Select a math section from the menu on the left to view available activities and lessons.</p>
</body>
</html>
