<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Practice</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #F07167;
            color: #333333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
        }

        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 600px;
        }

        h1 {
            color: #222222;
            margin-top: 0;
            text-align: center;
        }

        .question-block {
            margin-bottom: 25px;
            text-align: left;
            border-bottom: 1px solid #eee;
            padding-bottom: 15px;
        }

        label {
            display: block;
            margin: 8px 0;
            cursor: pointer;
        }

        .action-button {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: #00838f;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            margin-top: 20px;
        }

        .action-button:hover {
            background-color: #005f6b;
        }

        .back-button {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 15px;
            background-color: #333333;
            color: #ffffff;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            width: 100%;
            text-align: center;
        }

        .back-button:hover {
            background-color: #555555;
        }

        #results {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            color: #00838f;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 id="quiz-title">Loading Quiz...</h1>
        <div id="quiz-content"></div>
        <div id="results"></div>
        <button class="back-button" onclick="location.href='index.html'">← Back to Hub</button>
    </div>

    <script>
        // 1. Extract the 'topic' parameter from the URL (e.g., ?topic=zeros)
        const urlParams = new URLSearchParams(window.location.search);
        const topic = urlParams.get('topic');

        if (!topic) {
            document.getElementById('quiz-title').innerText = "Error";
            document.getElementById('quiz-content').innerText = "No topic specified.";
        } else {
            // 2. Dynamically load the matching question script from the questions/ folder
            const script = document.createElement('script');
            script.src = `questions/${topic}.js`;
            
            script.onload = () => {
                if (typeof quizData !== 'undefined') {
                    buildQuiz(quizData);
                } else {
                    showError("Question data variable 'quizData' not found in file.");
                }
            };

            script.onerror = () => {
                showError(`Could not load question file: questions/${topic}.js`);
            };

            document.head.appendChild(script);
        }

        function showError(message) {
            document.getElementById('quiz-title').innerText = "Missing Content";
            document.getElementById('quiz-content').innerHTML = `<p style="color: red; text-align: center;">${message}</p>`;
        }

        // 3. Render the questions onto the page dynamically
        function buildQuiz(data) {
            document.getElementById('quiz-title').innerText = data.title || "Practice Quiz";
            const contentDiv = document.getElementById('quiz-content');
            contentDiv.innerHTML = '';

            data.questions.forEach((q, qIndex) => {
                let qDiv = document.createElement('div');
                qDiv.className = 'question-block';
                
                let questionHTML = `<p><strong>${qIndex + 1}. ${q.question}</strong></p>`;
                
                q.options.forEach((opt, optIndex) => {
                    questionHTML += `
                        <label>
                            <input type="radio" name="question-${qIndex}" value="${optIndex}"> 
                            ${opt}
                        </label>
                    `;
                });

                qDiv.innerHTML = questionHTML;
                contentDiv.appendChild(qDiv);
            });

            // Add submit button
            let submitBtn = document.createElement('button');
            submitBtn.className = 'action-button';
            submitBtn.innerText = "Check Answers";
            submitBtn.onclick = () => gradeQuiz(data.questions);
            contentDiv.appendChild(submitBtn);
        }

        // 4. Grade the user's choices
        function gradeQuiz(questions) {
            let score = 0;
            questions.forEach((q, qIndex) => {
                const selectedOption = document.querySelector(`input[name="question-${qIndex}"]:checked`);
                if (selectedOption && parseInt(selectedOption.value) === q.correct) {
                    score++;
                }
            });

            document.getElementById('results').innerText = `You scored ${score} out of ${questions.length}!`;
        }
    </script>
</body>
</html>
