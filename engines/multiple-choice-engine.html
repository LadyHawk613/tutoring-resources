<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiple Choice Practice</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 40px;
        }

        .practice-box {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            color: #333;
        }

        .progress {
            color: #777;
            margin-bottom: 25px;
        }

        .question {
            font-size: 22px;
            margin-bottom: 25px;
        }

        .choice {
            display: block;
            padding: 15px;
            margin: 10px 0;
            border: 2px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
        }

        .choice:hover {
            background: #f0f4f7;
        }

        .choice input {
            margin-right: 12px;
        }

        button {
            margin-top: 20px;
            padding: 12px 24px;
            border: none;
            border-radius: 7px;
            background: #167c80;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .feedback {
            margin-top: 25px;
            padding: 18px;
            border-radius: 8px;
            display: none;
        }

        .correct {
            background: #e5f6e8;
            color: #176b2c;
        }

        .incorrect {
            background: #fdeaea;
            color: #9b2226;
        }

        .explanation {
            margin-top: 10px;
            color: #333;
        }

        .back-button {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 15px;
            background-color: #333333;
            color: #ffffff;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            text-align: center;
        }

        .back-button:hover {
            background-color: #555555;
        }
    </style>
</head>

<body>

<div class="practice-box">
    <h1 id="activityTitle">Multiple Choice Practice</h1>
    <div class="progress" id="progress"></div>
    <div class="question" id="question">Loading questions...</div>
    <div id="choices"></div>
    <button id="actionButton" style="display:none;">Check Answer</button>
    <div id="feedback" class="feedback"></div>
    <br><br>
    <a href="../math3/math3-hub.html" class="back-button">← Back to Math 3 Hub</a>
</div>

<script>
    // 1. Read the 'topic' parameter from the URL (e.g., ?topic=zeros)
    const urlParams = new URLSearchParams(window.location.search);
    const topic = urlParams.get('topic');

    if (!topic) {
        document.getElementById("question").textContent = "Error: No topic specified.";
        document.getElementById("actionButton").style.display = "none";
    } else {
        // 2. Dynamically load the correct question file from the questions/ folder
        const script = document.createElement('script');
        script.src = `../questions/${topic}.js`;
        
        script.onload = function() {
            if (typeof questions !== 'undefined') {
                document.getElementById("actionButton").style.display = "block";
                displayQuestion();
            } else {
                document.getElementById("question").textContent = "Error: 'questions' variable not found in file.";
                document.getElementById("actionButton").style.display = "none";
            }
        };

        script.onerror = function() {
            document.getElementById("question").textContent = `Error: Could not load question file (questions/${topic}.js).`;
            document.getElementById("actionButton").style.display = "none";
        };

        document.head.appendChild(script);
    }

    // ------------------------------------------
    // MULTIPLE-CHOICE ENGINE LOGIC
    // ------------------------------------------

    let currentQuestion = 0;

    function displayQuestion() {
        const q = questions[currentQuestion];

        document.getElementById("progress").textContent =
            `Question ${currentQuestion + 1} of ${questions.length}`;

        document.getElementById("question").textContent =
            q.question;

        const choicesContainer = document.getElementById("choices");
        choicesContainer.innerHTML = "";

        q.choices.forEach((choice, index) => {
            const label = document.createElement("label");
            label.className = "choice";
            label.innerHTML = `
                <input type="radio" name="answer" value="${index}">
                ${String.fromCharCode(65 + index)}. ${choice}
            `;
            choicesContainer.appendChild(label);
        });

        document.getElementById("feedback").style.display = "none";
        const actionBtn = document.getElementById("actionButton");
        actionBtn.textContent = "Check Answer";
        actionBtn.onclick = checkAnswer;
    }

    function checkAnswer() {
        const selected = document.querySelector('input[name="answer"]:checked');
        const feedback = document.getElementById("feedback");

        if (!selected) {
            feedback.className = "feedback incorrect";
            feedback.innerHTML = "Please select an answer first.";
            feedback.style.display = "block";
            return;
        }

        const selectedAnswer = Number(selected.value);
        const q = questions[currentQuestion];

        if (selectedAnswer === q.answer) {
            feedback.className = "feedback correct";
            feedback.innerHTML = `
                <strong>✓ Correct!</strong>
                <div class="explanation">${q.explanation}</div>
            `;
        } else {
            const correctLetter = String.fromCharCode(65 + q.answer);
            const correctText = q.choices[q.answer];

            feedback.className = "feedback incorrect";
            feedback.innerHTML = `
                <strong>Not quite.</strong>
                <div class="explanation">
                    The correct answer is <strong>${correctLetter}. ${correctText}</strong>
                    <br><br>
                    ${q.explanation}
                </div>
            `;
        }

        feedback.style.display = "block";

        const actionBtn = document.getElementById("actionButton");
        if (currentQuestion < questions.length - 1) {
            actionBtn.textContent = "Next Question";
            actionBtn.onclick = nextQuestion;
        } else {
            actionBtn.textContent = "Practice Complete";
            actionBtn.onclick = finishPractice;
        }
    }

    function nextQuestion() {
        currentQuestion++;
        displayQuestion();
    }

    function finishPractice() {
        document.getElementById("question").textContent = "You have completed this practice set!";
        document.getElementById("choices").innerHTML = "";
        document.getElementById("feedback").style.display = "none";
        document.getElementById("actionButton").style.display = "none";
        document.getElementById("progress").textContent = "Practice Complete";
    }
</script>

</body>
</html>
