<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math 3</title>
    
    <!-- Import the hand-drawn chalk style font from Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cabin+Sketch:wght@700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: transparent;
            color: #333333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        .container {
            background-color: transparent;
            padding: 20px;
            width: 100%;
            max-width: 600px;
            text-align: center;
            box-shadow: none;
        }

        h1 {
            font-family: 'Cabin Sketch', cursive, sans-serif;
            color: #F07167;
            font-size: 36px;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-top: 0;
            margin-bottom: 25px;
        }

        /* 3-Column Grid Layout for buttons */
        .button-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 20px;
            margin-bottom: 30px;
        }

        /* Main Dashboard Button Style */
        .dashboard-button {
            background-color: #00838f;
            color: #ffffff;
            padding: 15px 10px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            transition: background-color 0.2s;
        }

        .dashboard-button:hover {
            background-color: #005f6b;
        }

    </style>
</head>
<body>

    <div class="container">
        <h1>Precalculus Activities</h1>
        
        <!-- 3-Column Grid Container -->
        <div class="button-grid">
            <button class="dashboard-button" onclick="top.location.href='screening-tool.html'">Diagnostic</button>

            <button class="dashboard-button" onclick="top.location.href='graphing-functions-study-guide.html'">Graphing Functions</button>

            <button class="dashboard-button" onclick="top.location.href='is-it-a-polynomial.html'">Is It A Polynomial?</button>

            <button class="dashboard-button" onclick="top.location.href='rate-of-change-explore.html'">Explore Rate of Change</button>

            <button class="dashboard-button" onclick="top.location.href='rate-of-change.html'">Rate of Change</button>

            <button class="dashboard-button" onclick="top.location.href='root-behavior-sort.html'">Root Behavior Sort</button>

            <button class="dashboard-button" onclick="top.location.href='end-behavior.html'">End Behavior</button>
            <button class="dashboard-button" onclick="top.location.href='find-hidden-multiplicity.html'">Hidden Multiplicity</button>
            <button class="dashboard-button" onclick="top.location.href='convert-to-vertex-form.html'">Convert To Vertex Form</button>
            <button class="dashboard-button" onclick="top.location.href='complete-the-square.html'">Completing the Square</button>

            <!-- Future buttons added here will automatically fill the 2nd and 3rd columns -->
        </div>

    </div>
</body>
</html>
