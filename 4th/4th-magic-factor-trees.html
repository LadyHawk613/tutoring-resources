<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic Factor Trees Activity</title>
    <style>
        body {
            background-color: #120521;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Arial', sans-serif;
        }

        /* Main container scaled to match the image dimensions */
        .math-activity-wrapper {
            position: relative;
            width: 1000px;
            height: 667px; /* Adjust height/width ratio to match your exact image dimensions */
            background-image: url('magician-factor-tree.png');
            background-size: 100% 100%;
            background-repeat: no-repeat;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border-radius: 12px;
            overflow: hidden;
        }

        /* Styling for interactive drop zones (the dashed circles at the bottom) */
        .drop-zone {
            position: absolute;
            width: 75px;
            height: 75px;
            border-radius: 50%;
            border: 3px dashed rgba(255, 255, 255, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            font-size: 24px;
            font-weight: bold;
            background-color: rgba(75, 0, 130, 0.2);
            transition: background-color 0.2s;
        }

        .drop-zone.drag-over {
            background-color: rgba(255, 215, 0, 0.4);
            border-color: #ffd700;
        }

        /* Precise coordinate placement for the 4 factor tree circles */
        /* Note: Adjust these pixel values to perfectly fit your background image graphic */
        .zone-1 { top: 600px; left: 345px; }
        .zone-2 { top: 600px; left: 450px; }
        .zone-3 { top: 600px; left: 555px; }
        .zone-4 { top: 600px; left: 660px; }

        /* Example styles for draggable number tiles in the bank */
        .number-bank-tile {
            position: absolute;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #ffe066, #f59f00);
            border: 2px solid #fff;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            font-weight: bold;
            color: #2b0a3d;
            cursor: grab;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        /* Example placement for number tiles inside the Magic Number Bank */
        .tile-2-1 { top: 435px; left: 745px; }
        .tile-2-2 { top: 435px; left: 815px; }
        .tile-2-3 { top: 435px; left: 885px; }
    </style>
</head>
<body>

    <div class="math-activity-wrapper">
        <!-- Interactive Drop Zones over the dashed circles -->
        <div class="drop-zone zone-1" ondragover="allowDrop(event)" ondragleave="removeHighlight(event)" ondrop="drop(event)" data-id="1"></div>
        <div class="drop-zone zone-2" ondragover="allowDrop(event)" ondragleave="removeHighlight(event)" ondrop="drop(event)" data-id="2"></div>
        <div class="drop-zone zone-3" ondragover="allowDrop(event)" ondragleave="removeHighlight(event)" ondrop="drop(event)" data-id="3"></div>
        <div class="drop-zone zone-4" ondragover="allowDrop(event)" ondragleave="removeHighlight(event)" ondrop="drop(event)" data-id="4"></div>

        <!-- Draggable Number Bank Items (Sample) -->
        <div class="number-bank-tile tile-2-1" draggable="true" ondragstart="drag(event)" id="num-2">2</div>
        <div class="number-bank-tile tile-2-2" draggable="true" ondragstart="drag(event)" id="num-2-b">2</div>
        <div class="number-bank-tile tile-2-3" draggable="true" ondragstart="drag(event)" id="num-3">3</div>
    </div>

    <script>
        function allowDrop(ev) {
            ev.preventDefault();
            ev.currentTarget.classList.add('drag-over');
        }

        function removeHighlight(ev) {
            ev.currentTarget.classList.remove('drag-over');
        }

        function drag(ev) {
            ev.dataTransfer.setData("text", ev.target.innerText);
        }

        function drop(ev) {
            ev.preventDefault();
            ev.currentTarget.classList.remove('drag-over');
            var data = ev.dataTransfer.getData("text");
            ev.currentTarget.innerText = data;
        }
    </script>
</body>
</html>
