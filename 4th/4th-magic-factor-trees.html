<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic Factor Trees Activity</title>
    <style>
        body {
            background-color: #120521;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Arial', sans-serif;
        }

        /* Main container scaled to match the image dimensions */
        .math-activity-wrapper {
            position: relative;
            width: 1000px;
            height: 667px;
            background-image: url('magician-factor-tree.png');
            background-size: 100% 100%;
            background-repeat: no-repeat;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border-radius: 12px;
            overflow: hidden;
        }

        /* Styling for interactive drop zones */
        .drop-zone {
            position: absolute;
            width: 65px;
            height: 65px;
            border-radius: 50%;
            border: 3px dashed rgba(255, 255, 255, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            font-size: 22px;
            font-weight: bold;
            background-color: rgba(75, 0, 130, 0.3);
            transition: background-color 0.2s;
        }

        .drop-zone.drag-over {
            background-color: rgba(255, 215, 0, 0.4);
            border-color: #ffd700;
        }

        /* Perfectly aligned drop zones over the tree's bottom circles */
        .zone-1 { top: 482px; left: 327px; }
        .zone-2 { top: 482px; left: 420px; }
        .zone-3 { top: 482px; left: 518px; }
        .zone-4 { top: 482px; left: 610px; }

        /* CSS Grid Container placed precisely over the Magic Number Bank parchment */
        .number-bank-container {
            position: absolute;
            top: 348px;
            left: 732px;
            width: 224px;
            height: 224px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 6px;
        }

        /* Uniform styles for draggable number tiles handled by the grid */
        .number-bank-tile {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #ffe066, #f59f00);
            border: 2px solid #fff;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            color: #2b0a3d;
            cursor: grab;
            box-shadow: 0 3px 5px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <div class="math-activity-wrapper">
        <!-- Interactive Drop Zones -->
        <div class="drop-zone zone-1" ondragover="allowDrop(event)" ondragleave="removeHighlight(event)" ondrop="drop(event)" data-id="1"></div>
        <div class="drop-zone zone-2" ondragover="allowDrop(event)" ondragleave="removeHighlight(event)" ondrop="drop(event)" data-id="2"></div>
        <div class="drop-zone zone-3" ondragover="allowDrop(event)" ondragleave="removeHighlight(event)" ondrop="drop(event)" data-id="3"></div>
        <div class="drop-zone zone-4" ondragover="allowDrop(event)" ondragleave="removeHighlight(event)" ondrop="drop(event)" data-id="4"></div>

        <!-- Magic Number Bank Grid Container -->
        <div class="number-bank-container">
            <div class="number-bank-tile" draggable="true" ondragstart="drag(event)">2</div>
            <div class="number-bank-tile" draggable="true" ondragstart="drag(event)">2</div>
            <div class="number-bank-tile" draggable="true" ondragstart="drag(event)">2</div>
            <div class="number-bank-tile" draggable="true" ondragstart="drag(event)">3</div>
            <div class="number-bank-tile" draggable="true" ondragstart="drag(event)">4</div>
            <div class="number-bank-tile" draggable="true" ondragstart="drag(event)">6</div>
            <div class="number-bank-tile" draggable="true" ondragstart="drag(event)">8</div>
            <div class="number-bank-tile" draggable="true" ondragstart="drag(event)">12</div>
            <div class="number-bank-tile" draggable="true" ondragstart="drag(event)">24</div>
        </div>
    </div>

    <script>
        function allowDrop(ev) {
            ev.preventDefault();
            ev.currentTarget.classList.add('drag-over');
        }

        function removeHighlight(ev) {
            ev.currentTarget.classList.remove('drag-over');
        }

        function drag(ev) {
            ev.dataTransfer.setData("text", ev.target.innerText);
        }

        function drop(ev) {
            ev.preventDefault();
            ev.currentTarget.classList.remove('drag-over');
            var data = ev.dataTransfer.getData("text");
            ev.currentTarget.innerText = data;
        }
    </script>
</body>
</html>
