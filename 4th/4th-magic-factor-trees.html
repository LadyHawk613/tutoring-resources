<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic Factor Trees Activity</title>
    <style>
        body {
            background-color: #120521;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Arial', sans-serif;
        }

        /* Main container scaled to match the image dimensions */
        .math-activity-wrapper {
            position: relative;
            width: 1000px;
            height: 667px;
            background-image: url('magician-factor-tree.png');
            background-size: 100% 100%;
            background-repeat: no-repeat;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border-radius: 12px;
            overflow: hidden;
        }

        /* Styling for interactive drop zones */
        .drop-zone {
            position: absolute;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 3px dashed rgba(255, 255, 255, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            font-size: 22px;
            font-weight: bold;
            background-color: rgba(75, 0, 130, 0.3);
            transition: background-color 0.2s;
        }

        .drop-zone.drag-over {
            background-color: rgba(255, 215, 0, 0.4);
            border-color: #ffd700;
        }

        /* Shifted upward to align with the bottom factor circles */
        .zone-1 { top: 468px; left: 318px; }
        .zone-2 { top: 468px; left: 408px; }
        .zone-3 { top: 468px; left: 518px; }
        .zone-4 { top: 468px; left: 608px; }

        /* Styles for draggable number tiles in the bank */
        .number-bank-tile {
            position: absolute;
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #ffe066, #f59f00);
            border: 2px solid #fff;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            color: #2b0a3d;
            cursor: grab;
            box-shadow: 0 3px 5px rgba(0,0,0,0.3);
        }

        /* Shifted upward to fit neatly inside the Magic Number Bank parchment */
        /* Row 1 */
        .tile-1-1 { top: 352px; left: 745px; }
        .tile-1-2 { top: 352px; left: 810px; }
        .tile-1-3 { top: 352px; left: 875px; }
        /* Row 2 */
        .tile-2-1 { top: 412px; left: 745px; }
        .tile-2-2 { top: 412px; left: 810px; }
        .tile-2-3 { top: 412px; left: 875px; }
        /* Row 3 */
        .tile-3-1 { top: 472px; left: 745px; }
        .tile-3-2 { top: 472px; left: 810px; }
        .tile-3-3 { top: 472px; left: 875px; }
    </style>
</head>
<body>

    <div class="math-activity-wrapper">
        <!-- Interactive Drop Zones over the dashed circles -->
        <div class="drop-zone zone-1" ondragover="allowDrop(event)" ondragleave="removeHighlight(event)" ondrop="drop(event)" data-id="1"></div>
        <div class="drop-zone zone-2" ondragover="allowDrop(event)" ondragleave="removeHighlight(event)" ondrop="drop(event)" data-id="2"></div>
        <div class="drop-zone zone-3" ondragover="allowDrop(event)" ondragleave="removeHighlight(event)" ondrop="drop(event)" data-id="3"></div>
        <div class="drop-zone zone-4" ondragover="allowDrop(event)" ondragleave="removeHighlight(event)" ondrop="drop(event)" data-id="4"></div>

        <!-- Draggable Number Bank Items matching all 9 squares -->
        <div class="number-bank-tile tile-1-1" draggable="true" ondragstart="drag(event)">2</div>
        <div class="number-bank-tile tile-1-2" draggable="true" ondragstart="drag(event)">2</div>
        <div class="number-bank-tile tile-1-3" draggable="true" ondragstart="drag(event)">2</div>
        <div class="number-bank-tile tile-2-1" draggable="true" ondragstart="drag(event)">3</div>
        <div class="number-bank-tile tile-2-2" draggable="true" ondragstart="drag(event)">4</div>
        <div class="number-bank-tile tile-2-3" draggable="true" ondragstart="drag(event)">6</div>
        <div class="number-bank-tile tile-3-1" draggable="true" ondragstart="drag(event)">8</div>
        <div class="number-bank-tile tile-3-2" draggable="true" ondragstart="drag(event)">12</div>
        <div class="number-bank-tile tile-3-3" draggable="true" ondragstart="drag(event)">24</div>
    </div>

    <script>
        function allowDrop(ev) {
            ev.preventDefault();
            ev.currentTarget.classList.add('drag-over');
        }

        function removeHighlight(ev) {
            ev.currentTarget.classList.remove('drag-over');
        }

        function drag(ev) {
            ev.dataTransfer.setData("text", ev.target.innerText);
        }

        function drop(ev) {
            ev.preventDefault();
            ev.currentTarget.classList.remove('drag-over');
            var data = ev.dataTransfer.getData("text");
            ev.currentTarget.innerText = data;
        }
    </script>
</body>
</html>
