<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spider Web Factors - 4th Grade Math</title>
    <!-- Google Fonts for Chalkboard/Playful look -->
    <link href="https://fonts.googleapis.com/css2?family=Cabin+Sketch:wght@700&family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        chalk: ['"Cabin Sketch"', 'cursive'],
                        sans: ['Fredoka', 'sans-serif'],
                    },
                    colors: {
                        spiderDark: '#1a0b2e',
                        spiderCard: '#2d124a',
                        spiderPurple: '#4c1d95',
                        spiderAccent: '#7c3aed',
                        spiderGold: '#fbbf24',
                        spiderTeal: '#14b8a6',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #1a0b2e;
            color: #f3f4f6;
            font-family: 'Fredoka', sans-serif;
            overflow: hidden; /* Prevent body scrolling */
        }
        .chalk-title {
            font-family: 'Cabin Sketch', cursive;
        }
        /* Web shake animation for incorrect clicks */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }
        .animate-shake {
            animation: shake 0.4s ease-in-out;
        }
        /* Pulse glow for target */
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 15px rgba(251, 191, 36, 0.6); }
            50% { box-shadow: 0 0 30px rgba(251, 191, 36, 0.9); }
        }
        .target-glow {
            animation: pulse-glow 2s infinite;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between p-2 select-none">

    <!-- TOP HEADER -->
    <header class="w-full max-w-2xl mx-auto flex items-center justify-between bg-spiderCard/85 backdrop-blur border border-spiderAccent/40 rounded-xl px-4 py-2 shadow-lg">
        <div class="flex items-center space-x-2">
            <span class="text-2xl">🕷️</span>
            <div>
                <h1 class="chalk-title text-xl text-spiderGold tracking-wide">Spider Web Factors</h1>
                <p class="text-xs text-purple-300">Help Inky find all the correct factors!</p>
            </div>
        </div>
        <div class="flex items-center space-x-4 text-sm font-semibold">
            <div class="bg-spiderDark px-3 py-1 rounded-lg border border-spiderAccent/30 flex items-center space-x-1">
                <span>⭐</span>
                <span id="score-display" class="text-spiderGold">0</span>
            </div>
            <div class="bg-spiderDark px-3 py-1 rounded-lg border border-spiderAccent/30 flex items-center space-x-1">
                <span>🔥</span>
                <span id="streak-display" class="text-orange-400">0</span>
            </div>
        </div>
    </header>

    <!-- MAIN GAME CONTAINER -->
    <main class="w-full max-w-xl mx-auto flex-1 flex flex-col items-center justify-center relative my-1">
        
        <!-- INSTRUCTION BANNER -->
        <div id="instruction-banner" class="mb-2 text-center bg-spiderPurple/40 border border-spiderAccent/50 px-4 py-1.5 rounded-full text-xs text-purple-200">
            Click all the numbers that divide evenly into the target!
        </div>

        <!-- WEB CANVAS AREA (Fixed compact sizing to avoid scrolling) -->
        <div id="game-board" class="relative w-[320px] h-[320px] sm:w-[360px] sm:h-[360px] flex items-center justify-center">
            
            <!-- SVG Spider Web Background Lines -->
            <svg class="absolute inset-0 w-full h-full pointer-events-none" viewBox="0 0 400 400">
                <!-- Concentric Web Rings -->
                <circle cx="200" cy="200" r="160" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-opacity="0.4"/>
                <circle cx="200" cy="200" r="120" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-opacity="0.4"/>
                <circle cx="200" cy="200" r="80" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-opacity="0.4"/>
                
                <!-- Radial Spokes -->
                <g stroke="#7c3aed" stroke-width="1.5" stroke-opacity="0.4" id="web-spokes">
                </g>
            </svg>

            <!-- CENTER TARGET NODE -->
            <div class="absolute z-10 w-20 h-20 bg-gradient-to-br from-amber-400 to-amber-600 rounded-full flex flex-col items-center justify-center text-spiderDark border-4 border-spiderDark target-glow shadow-2xl">
                <span class="text-[10px] uppercase font-bold tracking-wider opacity-80 leading-none">Target</span>
                <span id="target-number" class="chalk-title text-3xl leading-tight">12</span>
            </div>

            <!-- DEW DROP FACTOR NODES CONTAINER -->
            <div id="nodes-container" class="absolute inset-0">
            </div>
        </div>

        <!-- FEEDBACK MESSAGE -->
        <div id="feedback-msg" class="h-6 text-center text-xs font-semibold text-spiderTeal transition-opacity duration-300"></div>
    </main>

    <!-- FOOTER CONTROLS -->
    <footer class="w-full max-w-xl mx-auto flex items-center justify-between bg-spiderCard/85 backdrop-blur border border-spiderAccent/40 rounded-xl px-4 py-2 shadow-lg mb-1">
        <div class="text-xs text-purple-300">
            Found: <span id="found-count" class="font-bold text-white">0</span> / <span id="total-factors-count" class="font-bold text-spiderGold">6</span> correct factors
        </div>
        <button id="check-btn" onclick="checkAnswers()" class="bg-gradient-to-r from-teal-500 to-emerald-600 hover:from-teal-400 hover:to-emerald-500 text-white text-sm font-semibold px-6 py-2 rounded-lg shadow-lg transform active:scale-95 transition flex items-center space-x-1.5 cursor-pointer">
            <span>✨</span>
            <span>Check Web!</span>
        </button>
    </footer>

    <!-- LEVEL COMPLETE / CELEBRATION MODAL -->
    <div id="modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-spiderCard border-2 border-spiderGold rounded-2xl p-6 max-w-sm w-full text-center shadow-2xl">
            <div class="text-5xl mb-2">🎉🕷️</div>
            <h2 id="modal-title" class="chalk-title text-3xl text-spiderGold mb-1">Web Mastered!</h2>
            <p id="modal-text" class="text-sm text-purple-200 mb-4">You found all the correct factors for this number!</p>
            <button onclick="nextLevel()" class="w-full bg-spiderGold hover:bg-amber-400 text-spiderDark font-bold py-3 rounded-xl shadow-lg transition text-base cursor-pointer">
                Next Web 🕸️
            </button>
        </div>
    </div>

    <!-- GAME LOGIC SCRIPT -->
    <script>
        let currentLevel = 1;
        let score = 0;
        let streak = 0;
        let targetNum = 12;
        let allPossibleNumbers = [];
        let correctFactors = [];
        let selectedNumbers = new Set();

        const levelTargets = [12, 16, 18, 20, 24, 30, 36, 40, 48, 50];

        function getFactors(n) {
            const factors = [];
            for (let i = 1; i <= n; i++) {
                if (n % i === 0) factors.push(i);
            }
            return factors;
        }

        function initGame() {
            const targetIndex = (currentLevel - 1) % levelTargets.length;
            targetNum = levelTargets[targetIndex];
            correctFactors = getFactors(targetNum);
            selectedNumbers.clear();

            document.getElementById('target-number').innerText = targetNum;
            
            let distractors = [];
            for (let i = 2; i <= Math.max(targetNum + 5, 20); i++) {
                if (!correctFactors.includes(i) && i !== targetNum && !distractors.includes(i)) {
                    distractors.push(i);
                }
            }
            distractors.sort(() => Math.random() - 0.5);
            const neededDistractorsCount = Math.max(4, 10 - correctFactors.length);
            let selectedDistractors = distractors.slice(0, neededDistractorsCount);

            allPossibleNumbers = [...correctFactors, ...selectedDistractors].sort(() => Math.random() - 0.5);
            if (allPossibleNumbers.length > 10) {
                let onlyDistractors = allPossibleNumbers.filter(n => !correctFactors.includes(n));
                onlyDistractors = onlyDistractors.slice(0, 10 - correctFactors.length);
                allPossibleNumbers = [...correctFactors, ...onlyDistractors].sort(() => Math.random() - 0.5);
            }

            document.getElementById('total-factors-count').innerText = correctFactors.length;
            document.getElementById('feedback-msg').innerText = '';
            document.getElementById('modal').classList.add('hidden');
            document.getElementById('modal').classList.remove('flex');

            renderWeb();
            updateStats();
        }

        function renderWeb() {
            const container = document.getElementById('nodes-container');
            container.innerHTML = '';

            const spokesGroup = document.getElementById('web-spokes');
            spokesGroup.innerHTML = '';

            const totalNodes = allPossibleNumbers.length;
            const radius = 130;
            const centerX = 200;
            const centerY = 200;

            allPossibleNumbers.forEach((num, index) => {
                const angle = (index / totalNodes) * 2 * Math.PI - Math.PI / 2;
                
                const xPct = 50 + (Math.cos(angle) * (radius / 200) * 44);
                const yPct = 50 + (Math.sin(angle) * (radius / 200) * 44);

                const nodeX = centerX + Math.cos(angle) * radius;
                const nodeY = centerY + Math.sin(angle) * radius;
                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', centerX);
                line.setAttribute('y1', centerY);
                line.setAttribute('x2', nodeX);
                line.setAttribute('y2', nodeY);
                line.setAttribute('stroke', '#7c3aed');
                line.setAttribute('stroke-width', '1.5');
                line.setAttribute('stroke-opacity', '0.4');
                spokesGroup.appendChild(line);

                const nodeEl = document.createElement('div');
                const isSelected = selectedNumbers.has(num);
                
                nodeEl.className = `absolute w-11 h-11 sm:w-12 sm:h-12 -ml-5.5 -mt-5.5 rounded-full flex items-center justify-center font-bold text-base sm:text-lg cursor-pointer transition-colors duration-200 shadow-md border-2 ${
                    isSelected 
                        ? 'bg-spiderTeal text-white border-white ring-4 ring-spiderTeal/40 scale-105' 
                        : 'bg-spiderPurple hover:bg-spiderAccent text-purple-100 border-spiderAccent/80'
                }`;
                
                nodeEl.style.left = `${xPct}%`;
                nodeEl.style.top = `${yPct}%`;
                nodeEl.innerText = num;

                nodeEl.onclick = () => toggleNumber(num, nodeEl);
                container.appendChild(nodeEl);
            });
        }

        function toggleNumber(num, element) {
            if (selectedNumbers.has(num)) {
                selectedNumbers.delete(num);
            } else {
                selectedNumbers.add(num);
            }
            
            const isSelected = selectedNumbers.has(num);
            element.className = `absolute w-11 h-11 sm:w-12 sm:h-12 -ml-5.5 -mt-5.5 rounded-full flex items-center justify-center font-bold text-base sm:text-lg cursor-pointer transition-colors duration-200 shadow-md border-2 ${
                isSelected 
                    ? 'bg-spiderTeal text-white border-white ring-4 ring-spiderTeal/40 scale-105' 
                    : 'bg-spiderPurple hover:bg-spiderAccent text-purple-100 border-spiderAccent/80'
            }`;

            document.getElementById('found-count').innerText = selectedNumbers.size;
        }

        function checkAnswers() {
            let correctSelected = 0;
            let incorrectSelected = false;

            selectedNumbers.forEach(num => {
                if (correctFactors.includes(num)) {
                    correctSelected++;
                } else {
                    incorrectSelected = true;
                }
            });

            const feedbackEl = document.getElementById('feedback-msg');
            const boardEl = document.getElementById('game-board');

            if (incorrectSelected || correctSelected < correctFactors.length) {
                boardEl.classList.add('animate-shake');
                setTimeout(() => boardEl.classList.remove('animate-shake'), 400);

                streak = 0;
                updateStats();

                if (incorrectSelected) {
                    feedbackEl.className = "h-6 text-center text-xs font-semibold text-rose-400";
                    feedbackEl.innerText = "Oops! That's not a factor. Check again!";
                } else {
                    feedbackEl.className = "h-6 text-center text-xs font-semibold text-amber-300";
                    feedbackEl.innerText = `You found ${correctSelected} out of ${correctFactors.length} factors. Keep looking!`;
                }
            } else {
                streak++;
                score += 100 + (streak * 10);
                updateStats();

                feedbackEl.className = "h-6 text-center text-xs font-semibold text-spiderTeal";
                feedbackEl.innerText = "Fantastic job! Web completed!";

                setTimeout(() => {
                    const modal = document.getElementById('modal');
                    modal.classList.remove('hidden');
                    modal.classList.add('flex');
                }, 500);
            }
        }

        function updateStats() {
            document.getElementById('score-display').innerText = score;
            document.getElementById('streak-display').innerText = streak;
            document.getElementById('found-count').innerText = selectedNumbers.size;
        }

        function nextLevel() {
            currentLevel++;
            initGame();
        }

        window.onload = initGame;
    </script>
</body>
</html>
