<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fraction Pizza Shop</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #7b2d26, #d95d39);
  display: flex;
  justify-content: center;
  align-items: center;
  color: #243b53;
}
.game {
  width: min(950px, 94vw);
  background: #fffaf3;
  border-radius: 24px;
  padding: 26px;
  box-shadow: 0 15px 40px rgba(0,0,0,.3);
  text-align: center;
}
h1 { margin: 0 0 5px; font-size: 2.4rem; }
.subtitle { color: #627d98; margin-bottom: 18px; }
.stats {
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 18px;
}
.stat {
  background: #f3ead8;
  padding: 10px 18px;
  border-radius: 12px;
  font-weight: bold;
  min-width: 150px;
}
.order {
  background: white;
  border: 3px solid #eadbc8;
  border-radius: 18px;
  padding: 20px;
}
.order h2 { margin: 0 0 8px; }
.problem {
  font-size: 1.55rem;
  font-weight: bold;
  margin: 14px auto 20px;
  max-width: 750px;
}
.pizza-area {
  display: flex;
  justify-content: center;
  margin: 12px 0 20px;
}
.pizza {
  width: 220px;
  height: 220px;
  border-radius: 50%;
  background: #f5c16c;
  border: 12px solid #c98942;
  position: relative;
  overflow: hidden;
}
.slice {
  position: absolute;
  inset: 0;
  clip-path: polygon(50% 50%, 100% 0, 100% 100%);
  transform-origin: 50% 50%;
  background: #ef6c45;
  border-right: 3px solid #fff4df;
}
.cheese {
  position: absolute;
  inset: 10px;
  border-radius: 50%;
  background: #ffd66b;
  z-index: 0;
}
.topping {
  position: absolute;
  width: 18px;
  height: 18px;
  background: #b83a2e;
  border-radius: 50%;
  z-index: 3;
}
#pizzaVisual { position: relative; width: 220px; height: 220px; }

.answers {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
}
.answer {
  background: #1677ff;
  color: white;
  border: 0;
  border-radius: 12px;
  padding: 13px 22px;
  font-size: 1.15rem;
  font-weight: bold;
  cursor: pointer;
  min-width: 110px;
}
.answer:hover { transform: translateY(-2px); }
.feedback {
  min-height: 35px;
  margin-top: 14px;
  font-weight: bold;
  font-size: 1.1rem;
}
.correct { color: #168a45; }
.wrong { color: #c92a2a; }
.finish { display: none; padding: 25px; }
.pizza-big { font-size: 5rem; }
.restart {
  background: #f6a800;
  color: #243b53;
  border: 0;
  border-radius: 12px;
  padding: 13px 24px;
  font-size: 1.05rem;
  font-weight: bold;
  cursor: pointer;
}
.progress {
  height: 12px;
  background: #e4e7eb;
  border-radius: 20px;
  overflow: hidden;
  margin: 14px auto;
  max-width: 650px;
}
.progress-bar {
  height: 100%;
  width: 0%;
  background: #f6a800;
  transition: width .3s;
}
</style>
</head>
<body>
<div class="game">
  <h1>🍕 Fraction Pizza Shop</h1>
  <div class="subtitle">Complete the pizza orders and earn pizza points!</div>

  <div class="stats">
    <div class="stat">🍕 Pizza Points: <span id="points">0</span></div>
    <div class="stat">📦 Orders: <span id="orders">0</span>/8</div>
    <div class="stat">🔥 Streak: <span id="streak">0</span></div>
  </div>

  <div class="progress"><div class="progress-bar" id="progress"></div></div>

  <div class="order" id="order">
    <h2 id="orderTitle"></h2>
    <div class="pizza-area"><div id="pizzaVisual"></div></div>
    <div class="problem" id="problem"></div>
    <div class="answers" id="answers"></div>
    <div class="feedback" id="feedback"></div>
  </div>

  <div class="finish" id="finish">
    <div class="pizza-big">🍕</div>
    <h2>Pizza Shop Champion!</h2>
    <p>You completed every order!</p>
    <h2>Final Score: <span id="finalPoints"></span> 🍕</h2>
    <button class="restart" onclick="restart()">Open the Shop Again</button>
  </div>
</div>

<script>
const questions = [
  {
    title:"Order #1 — The Cheese Pizza",
    problem:"The pizza is cut into 4 equal slices. The customer wants 1 slice. What fraction of the pizza is that?",
    answers:["1/2","1/4","3/4","4/4"], correct:"1/4", parts:4, shaded:1
  },
  {
    title:"Order #2 — Pepperoni Party",
    problem:"A pizza has 8 equal slices. 5 slices have pepperoni. What fraction has pepperoni?",
    answers:["3/8","5/8","5/4","1/8"], correct:"5/8", parts:8, shaded:5
  },
  {
    title:"Order #3 — Compare the Orders",
    problem:"Which fraction is greater?",
    answers:["1/4","3/4","2/4","All are equal"], correct:"3/4", parts:4, shaded:3
  },
  {
    title:"Order #4 — Equivalent Pizza",
    problem:"Which fraction is equal to 2/4?",
    answers:["1/2","1/4","3/4","2/8"], correct:"1/2", parts:4, shaded:2
  },
  {
    title:"Order #5 — Three Slices",
    problem:"A pizza is cut into 6 equal slices. 3 slices are eaten. What fraction was eaten?",
    answers:["1/6","2/6","3/6","5/6"], correct:"3/6", parts:6, shaded:3
  },
  {
    title:"Order #6 — More or Less?",
    problem:"Which fraction is LESS than 1/2?",
    answers:["3/4","2/4","1/4","4/4"], correct:"1/4", parts:4, shaded:1
  },
  {
    title:"Order #7 — Double the Slices",
    problem:"Which fraction is equivalent to 1/2?",
    answers:["2/4","2/3","1/3","3/4"], correct:"2/4", parts:4, shaded:2
  },
  {
    title:"Order #8 — Super Pizza",
    problem:"A pizza has 8 slices. 6 slices are cheese. What fraction is cheese?",
    answers:["2/8","4/8","6/8","8/8"], correct:"6/8", parts:8, shaded:6
  }
];

let current = 0;
let points = 0;
let streak = 0;

function drawPizza(parts, shaded) {
  const container = document.getElementById("pizzaVisual");
  container.innerHTML = "";

  const pizza = document.createElement("div");
  pizza.className = "pizza";

  const cheese = document.createElement("div");
  cheese.className = "cheese";
  pizza.appendChild(cheese);

  for (let i = 0; i < shaded; i++) {
    const slice = document.createElement("div");
    slice.className = "slice";
    slice.style.transform = `rotate(${i * (360 / parts)}deg)`;
    pizza.appendChild(slice);
  }

  // Add simple pepperoni dots for visual interest.
  const positions = [
    [70,45],[130,60],[95,105],[145,125],[55,135],[115,160],[165,95],[75,175]
  ];
  positions.slice(0, Math.min(shaded + 2, 8)).forEach(p => {
    const t = document.createElement("div");
    t.className = "topping";
    t.style.left = p[0] + "px";
    t.style.top = p[1] + "px";
    pizza.appendChild(t);
  });

  container.appendChild(pizza);
}

function loadQuestion() {
  const q = questions[current];
  document.getElementById("orderTitle").textContent = q.title;
  document.getElementById("problem").textContent = q.problem;
  document.getElementById("feedback").textContent = "";
  document.getElementById("feedback").className = "feedback";
  document.getElementById("progress").style.width = (current / questions.length * 100) + "%";

  drawPizza(q.parts, q.shaded);

  const box = document.getElementById("answers");
  box.innerHTML = "";

  q.answers.forEach(answer => {
    const button = document.createElement("button");
    button.className = "answer";
    button.textContent = answer;
    button.onclick = () => check(answer);
    box.appendChild(button);
  });
}

function check(answer) {
  const q = questions[current];
  const feedback = document.getElementById("feedback");

  if (answer === q.correct) {
    streak++;
    points += 100 + (streak - 1) * 25;
    document.getElementById("points").textContent = points;
    document.getElementById("streak").textContent = streak;
    feedback.textContent = "🍕 Correct! Order complete!";
    feedback.className = "feedback correct";

    document.querySelectorAll(".answer").forEach(b => b.disabled = true);

    current++;
    document.getElementById("orders").textContent = current;

    setTimeout(() => {
      if (current === questions.length) {
        document.getElementById("order").style.display = "none";
        document.getElementById("finish").style.display = "block";
        document.getElementById("finalPoints").textContent = points;
        document.getElementById("progress").style.width = "100%";
      } else {
        loadQuestion();
      }
    }, 800);
  } else {
    streak = 0;
    document.getElementById("streak").textContent = streak;
    feedback.textContent = "Not quite. Look at the pizza and try another answer!";
    feedback.className = "feedback wrong";
  }
}

function restart() {
  current = 0;
  points = 0;
  streak = 0;
  document.getElementById("points").textContent = "0";
  document.getElementById("orders").textContent = "0";
  document.getElementById("streak").textContent = "0";
  document.getElementById("finish").style.display = "none";
  document.getElementById("order").style.display = "block";
  loadQuestion();
}

loadQuestion();
</script>
</body>
</html>
