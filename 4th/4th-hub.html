<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4th Grade Math</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #F07167; /* Same warm coral background */
            color: #333333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
        }

        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 800px; /* Widened to comfortably fit 3 columns */
            text-align: center;
        }

        h1 {
            color: #222222;
            margin-top: 0;
        }

        /* Grid container for activity buttons: 3 columns wide */
        .activity-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin: 20px 0;
        }

        .activity-button {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 15px;
            background-color: #007EA7; /* A nice blue color */
            color: #ffffff;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1em;
            text-align: center;
            min-height: 60px;
            box-sizing: border-box;
        }

        .activity-button:hover {
            background-color: #005f7f;
        }
        
        .back-button {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 15px;
            background-color: #333333;
            color: #ffffff;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }

        .back-button:hover {
            background-color: #555555;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>4th Grade Math</h1>
        <p>Welcome to 4th Grade Math!</p>

        <!-- Activity Grid: Add new activities here one at a time -->
        <div class="activity-grid">
            <a href="activity.html" class="activity-button">Place Value</a>
            <a href="4th-grade-activities/dirt-bike-9s.html" class="activity-button">Start Dirt Bike 9s</a>
            <a href="4th-grade-activities/pirate-times-four.html" class="activity-button">Pirate Multiplication: 4s</a>
            <a href="4th-grade-activities/math-escape-room.html" class="activity-button">Math Escape Room</a>
        </div>
        
        <!-- This button links back to your main dashboard -->
        <a href="index.html" class="back-button">← Back to Dashboard</a>
    </div>

</body>
</html>
