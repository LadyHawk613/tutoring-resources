<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Area Model Adventure!</title>
    <style>
        body {
            font-family: 'Comic Sans MS', 'Bubblegum Sans', Arial, sans-serif;
            background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #2c3e50;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            max-width: 600px;
            width: 100%;
            text-align: center;
            border: 5px solid #ff7675;
        }
        h1 {
            color: #d63031;
            margin-top: 0;
            font-size: 28px;
            text-shadow: 2px 2px 0px #ffeaa7;
        }
        .score-board {
            font-size: 18px;
            font-weight: bold;
            color: #0984e3;
            margin-bottom: 15px;
        }
        .problem-box {
            font-size: 26px;
            background: #ffeaa7;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 3px dashed #fdcb6e;
            color: #d35400;
        }
        .step-section {
            background: #f1f2f6;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            text-align: left;
            border: 3px solid #dfe4ea;
        }
        .step-title {
            font-weight: bold;
            color: #2f3640;
            margin-bottom: 10px;
            font-size: 18px;
        }
        /* Grid Layout for Area Model */
        .grid-container {
            display: grid;
            grid-template-columns: 80px 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
            align-items: center;
        }
        .grid-header {
            background: #0984e3;
            color: white;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            text-align: center;
        }
        .grid-side {
            background: #e84393;
            color: white;
            padding: 15px;
            border-radius: 8px;
            font-weight: bold;
            text-align: center;
        }
        .box-tens {
            background: #fab1a0;
            padding: 15px;
            border-radius: 10px;
            border: 2px solid #e17055;
            text-align: center;
        }
        .box-ones {
            background: #ffeaa7;
            padding: 15px;
            border-radius: 10px;
            border: 2px solid #f1c40f;
            text-align: center;
        }
        input[type="number"] {
            width: 70px;
            padding: 8px;
            font-size: 18px;
            text-align: center;
            border-radius: 6px;
            border: 2px solid #b2bec3;
            outline: none;
        }
        input[type="number"]:focus {
            border-color: #0984e3;
        }
        button.action-btn {
            background-color: #00b894;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 0 #00a884;
            transition: 0.1s;
            margin-top: 10px;
        }
        button.action-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #00a884;
        }
        .feedback {
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
        }
        .correct { color: #00b894; }
        .incorrect { color: #d63031; }
        .final-row {
            margin-top: 15px;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎨 Area Model Math Builder! 🚀</h1>
    <div class="score-board" id="scoreBoard">Problem 1 of 3</div>
    
    <div class="problem-box" id="problemDisplay">
        Solve: <span id="currentProblemText">34 × 4</span>
    </div>

    <div class="step-section">
        <div class="step-title">Step 1: Break apart the big number!</div>
        <span id="tensLabel">34</span> = <input type="number" id="inputTens" placeholder="Tens"> + <input type="number" id="inputOnes" placeholder="Ones">
    </div>

    <div class="step-section">
        <div class="step-title">Step 2: Multiply to find the area of each box!</div>
        <div class="grid-container">
            <div></div>
            <div class="grid-header" id="headerTens">30</div>
            <div class="grid-header" id="headerOnes">4</div>
            
            <div class="grid-side" id="sideMultiplier">4</div>
            <div class="box-tens">
                <input type="number" id="boxProduct1" placeholder="?">
            </div>
            <div class="box-ones">
                <input type="number" id="boxProduct2" placeholder="?">
            </div>
        </div>
    </div>

    <div class="step-section">
        <div class="step-title">Step 3: Add them all together!</div>
        <div class="final-row">
            Total Sum: <input type="number" id="inputFinal" placeholder="Total">
        </div>
    </div>

    <button class="action-btn" id="checkBtn" onclick="checkAnswers()">Check My Work! ✨</button>
    <div class="feedback" id="feedbackArea"></div>
</div>

<script>
    const problems = [
        { num: 34, mult: 4, tens: 30, ones: 4, p1: 120, p2: 16, total: 136 },
        { num: 42, mult: 3, tens: 40, ones: 2, p1: 120, p2: 6, total: 126 },
        { num: 23, mult: 5, tens: 20, ones: 3, p1: 100, p2: 15, total: 115 }
    ];

    let currentIdx = 0;

    function loadProblem() {
        let p = problems[currentIdx];
        document.getElementById("scoreBoard").innerText = `Problem ${currentIdx + 1} of ${problems.length}`;
        document.getElementById("currentProblemText").innerText = `${p.num} × ${p.mult}`;
        document.getElementById("tensLabel").innerText = `${p.num}`;
        document.getElementById("headerTens").innerText = `${p.tens}`;
        document.getElementById("headerOnes").innerText = `${p.ones}`;
        document.getElementById("sideMultiplier").innerText = `${p.mult}`;
        
        // Clear inputs
        document.getElementById("inputTens").value = "";
        document.getElementById("inputOnes").value = "";
        document.getElementById("boxProduct1").value = "";
        document.getElementById("boxProduct2").value = "";
        document.getElementById("inputFinal").value = "";
        document.getElementById("feedbackArea").innerText = "";
        document.getElementById("checkBtn").innerText = "Check My Work! ✨";
        document.getElementById("checkBtn").setAttribute("onclick", "checkAnswers()");
    }

    function checkAnswers() {
        let p = problems[currentIdx];
        
        let uTens = parseInt(document.getElementById("inputTens").value);
        let uOnes = parseInt(document.getElementById("inputOnes").value);
        let uBox1 = parseInt(document.getElementById("boxProduct1").value);
        let uBox2 = parseInt(document.getElementById("boxProduct2").value);
        let uFinal = parseInt(document.getElementById("inputFinal").value);

        let fb = document.getElementById("feedbackArea");

        if (isNaN(uTens) || isNaN(uOnes) || isNaN(uBox1) || isNaN(uBox2) || isNaN(uFinal)) {
            fb.className = "feedback incorrect";
            fb.innerText = "⚠️ Oops! Please fill in all the boxes before checking.";
            return;
        }

        if (uTens === p.tens && uOnes === p.ones && uBox1 === p.p1 && uBox2 === p.p2 && uFinal === p.total) {
            fb.className = "feedback correct";
            fb.innerText = "🎉 Awesome job! You crushed this area model! 🌟";
            
            if (currentIdx < problems.length - 1) {
                document.getElementById("checkBtn").innerText = "Next Problem ➡️";
                document.getElementById("checkBtn").setAttribute("onclick", "nextProblem()");
            } else {
                document.getElementById("checkBtn").innerText = "You Finished All Problems! 🏆";
                document.getElementById("checkBtn").disabled = true;
            }
        } else {
            fb.className = "feedback incorrect";
            fb.innerText = "❌ Not quite! Double-check your multiplication math inside the boxes and try again.";
        }
    }

    function nextProblem() {
        currentIdx++;
        loadProblem();
        document.getElementById("checkBtn").disabled = false;
    }

    loadProblem();
</script>

</body>
</html>
