<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Integrated Math 2 Diagnostic Screening</title>
    <style>
        :root {
            --primary-color: #6b21a8;
            --primary-hover: #581c87;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #cbd5e1;
            --success-color: #10b981;
            --error-color: #ef4444;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .quiz-container {
            background-color: var(--card-bg);
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            width: 100%;
            max-width: 650px;
            padding: 2.5rem;
            box-sizing: border-box;
        }

        h2 {
            margin-top: 0;
            font-size: 1.5rem;
            color: var(--primary-color);
            border-bottom: 2px solid #f3e8ff;
            padding-bottom: 0.5rem;
        }

        .progress-container {
            margin-bottom: 2rem;
        }

        .progress-text {
            font-size: 0.875rem;
            font-weight: 600;
            color: #64748b;
            margin-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
        }

        .progress-bar-bg {
            background-color: #e2e8f0;
            border-radius: 9999px;
            height: 0.75rem;
            width: 100%;
            overflow: hidden;
        }

        .progress-bar-fill {
            background-color: var(--primary-color);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }

        .question-box {
            margin-bottom: 2rem;
        }

        .question-text {
            font-size: 1.125rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            line-height: 1.5;
            white-space: pre-line;
        }

        .section-tag {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            background-color: #f3e8ff;
            color: var(--primary-color);
            padding: 0.25rem 0.5rem;
            border-radius: 0.25rem;
            display: inline-block;
            margin-bottom: 0.75rem;
            font-weight: 700;
        }

        .instruction-note {
            font-size: 0.85rem;
            color: #64748b;
            font-style: italic;
            margin-bottom: 1rem;
        }

        .inputs-container {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .input-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .input-group label {
            font-weight: 500;
            color: #475569;
            min-width: 90px;
        }

        input[type="text"] {
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            font-size: 1rem;
            width: 100%;
            max-width: 300px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(107, 33, 168, 0.1);
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 0.5rem;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .results-container {
            text-align: center;
        }

        .results-container h2 {
            font-size: 2rem;
            margin-bottom: 1rem;
            border: none;
        }

        .results-summary {
            font-size: 1.25rem;
            margin-bottom: 2rem;
            color: #475569;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <h2>Integrated Math 2 Diagnostic Screening</h2>
    
    <!-- Progress Bar Section -->
    <div id="progressSection" class="progress-container">
        <div class="progress-text">
            <span id="progressLabel">Question 1 of 30</span>
            <span id="remainingLabel">29 remaining</span>
        </div>
        <div class="progress-bar-bg">
            <div id="progressBarFill" class="progress-bar-fill"></div>
        </div>
    </div>

    <!-- Quiz Form / Question Card -->
    <div id="quizContent">
        <div class="question-box">
            <div id="sectionTag" class="section-tag">Part</div>
            <div id="questionText" class="question-text">Loading question...</div>
            <div id="instructionNote" class="instruction-note"></div>
            <div id="inputsContainer" class="inputs-container">
                <!-- Dynamic Inputs go here -->
            </div>
        </div>
        <button id="nextBtn" onclick="handleNext()">Submit & Next</button>
    </div>

    <!-- Results Section (Hidden Initially) -->
    <div id="resultsContainer" class="results-container hidden">
        <h2>Screening Complete!</h2>
        <div class="results-summary" id="resultsSummary"></div>
        <button onclick="restartQuiz()">Retake Screening</button>
    </div>
</div>

<script>
    // Full dataset matching the 30 problems from Integrated Math 2 Diagnostic
    const questions = [
        {
            section: "Part 1: Algebra Foundations",
            text: "1. Solve:\n3x + 7 = 25",
            instruction: "Enter the numerical value or equation format (e.g., 6 or x=6).",
            blanksCount: 1,
            validator: (ans) => {
                const c = ans[0].toLowerCase().replace(/\s+/g, '');
                return c === '6' || c === 'x=6';
            }
        },
        {
            section: "Part 1: Algebra Foundations",
            text: "2. Solve:\n5(2x - 3) = 35",
            instruction: "Enter the numerical value or equation format (e.g., 5 or x=5).",
            blanksCount: 1,
            validator: (ans) => {
                const c = ans[0].toLowerCase().replace(/\s+/g, '');
                return c === '5' || c === 'x=5';
            }
        },
        {
            section: "Part 1: Algebra Foundations",
            text: "3. Solve the inequality:\n4x - 5 < 19",
            instruction: "Enter the inequality format (e.g., x<6 or x < 6).",
            blanksCount: 1,
            validator: (ans) => {
                const c = ans[0].toLowerCase().replace(/\s+/g, '');
                return c === 'x<6';
            }
        },
        {
            section: "Part 1: Algebra Foundations",
            text: "4. Simplify:\n3x^2 + 5x - 2x^2 + 7",
            instruction: "Combine like terms and enter expression (e.g., x^2+5x+7).",
            blanksCount: 1,
            validator: (ans) => {
                const c = ans[0].toLowerCase().replace(/\s+/g, '');
                return c === 'x^2+5x+7' || c === '1x^2+5x+7' || c === 'x\u00b2+5x+7';
            }
        },
        {
            section: "Part 1: Algebra Foundations",
            text: "5. Multiply:\n(x + 4)(x - 3)",
            instruction: "Enter expanded polynomial expression (e.g., x^2+x-12).",
            blanksCount: 1,
            validator: (ans) => {
                const c = ans[0].toLowerCase().replace(/\s+/g, '');
                return c === 'x^2+x-12' || c === 'x^2+1x-12';
            }
        },
        {
            section: "Part 2: Functions",
            text: "6. If f(x) = 2x^2 - 3, find f(4).",
            instruction: "Enter the numerical result.",
            blanksCount: 1,
            validator: (ans) => {
                const c = ans[0].toLowerCase().replace(/\s+/g, '');
                return c === '29';
            }
        },
        {
            section: "Part 2: Functions",
            text: "7. Determine whether this relation is a function:\n{(1, 3), (2, 5), (1, 7), (4, 8)}\n(Type Yes or No)",
            instruction: "Enter Yes or No based on whether it is a function.",
            blanksCount: 1,
            validator: (ans) => {
                const c = ans[0].toLowerCase().replace(/\s+/g, '');
                return c === 'no';
            }
        },
        {
            section: "Part 2: Functions",
            text: "8. A function table is shown:\nx: 2, 4, 6\nf(x): 5, 9, 13\nIs this linear? (Type Yes or No)",
            instruction: "Enter Yes or No.",
            blanksCount: 1,
            validator: (ans) => {
                const c = ans[0].toLowerCase().replace(/\s+/g, '');
                return c === 'yes';
            }
        },
        {
            section: "Part 3: Linear Models",
            text: "9. Write the equation of the line:\nSlope = 3, Y-intercept = -5",
            instruction: "Enter in slope-intercept form (e.g., y=3x-5).",
            blanksCount: 1,
            validator: (ans) => {
                const c = ans[0].toLowerCase().replace(/\s+/g, '');
                return c === 'y=3x-5';
            }
        },
        {
            section: "Part 3: Linear Models",
            text: "10. Find the slope between points (2, 5) and (6, 13).",
            instruction: "Enter the numerical slope value (e.g., 2).",
            blanksCount: 1,
            validator: (ans) => {
                const c = ans[0].toLowerCase().replace(/\s+/g, '');
                return c === '2';
            }
        },
        {
            section: "Part 4: Systems",
            text: "11. Solve the system:\nx + y = 10\nx - y = 2",
            instruction: "Enter values for x and y in separate blanks.",
            blanksCount: 2,
            validator: (ans) => {
                const clean = ans.map(a => a.toLowerCase().replace(/\s+/g, '').replace('x=', '').replace('y=', ''));
                return (clean.includes('6') && clean.includes('4')) && clean[0] !== clean[1];
            }
        },
        {
            section: "Part 4: Systems",
            text: "12. Solve the system:\n2x + 3y = 12\nx - y = 1",
            instruction: "Enter values for x and y in separate blanks.",
            blanksCount: 2,
            validator: (ans) => {
                const clean = ans.map(a => a.toLowerCase().replace(/\s+/g, '').replace('x=', '').replace('y=', ''));
                return (clean.includes('3') && clean.includes('2')) && clean[0] !== clean[1];
            }
        },
        {
            section: "Part 4: Systems",
            text: "13. Movie tickets cost $12 and popcorn costs $5. A person buys 7 items for $59. How many tickets were bought?",
            instruction: "Enter the number of tickets bought.",
            blanksCount: 1,
            validator: (ans) => {
                const c = ans[0].toLowerCase().replace(/\s+/g, '');
                return c === '4';
            }
        },
        {
            section: "Part 5: Quadratics",
            text: "14. Factor:\nx^2 + 7x + 12",
            instruction: "Enter factors (e.g., (x+3)(x+4) or (x+4)(x+3)).",
            blanksCount: 1,
            validator: (ans) => {
                const c = ans[0].toLowerCase().replace(/\s+/g, '').replace(/\s/g, '');
                return c === '(x+3)(x+4)' || c === '(x+4)(x+3)' || c === '(x+3)(4+x)' || c === '(4+x)(3+x)';
            }
        },
        {
            section: "Part 5: Quadratics",
            text: "15. Solve:\nx^2 - 9 = 0",
            instruction: "Two solutions. Enter each solution in a separate blank (e.g., 3 and -3).",
            blanksCount: 2,
            validator: (ans) => {
                const clean = ans.map(a => a.toLowerCase().replace(/\s+/g, '').replace('x=', ''));
                const valid = ['3', '-3'];
                return valid.includes(clean[0]) && valid.includes(clean[1]) && clean[0] !== clean[1];
            }
        },
        {
            section: "Part 5: Quadratics",
            text: "16. Find the vertex of:\ny = (x - 3)^2 + 5",
            instruction: "Enter coordinate pair format (e.g., (3,5)).",
            blanksCount: 1,
            validator: (ans) => {
                const c = ans[0].toLowerCase().replace(/\s+/g, '');
                return c === '(3,5)';
            }
        },
        {
            section: "Part 5: Quadratics",
            text: "17. Solve using the quadratic formula:\nx^2 + 2x - 8 = 0",
            instruction: "Two solutions. Enter each solution in a separate blank (e.g., 2 and -4).",
            blanksCount: 2,
            validator: (ans) => {
                const clean = ans.map(a => a.toLowerCase().replace(/\s+/g, '').replace('x=', ''));
                const valid = ['2', '-4'];
                return valid.includes(clean[0]) && valid.includes(clean[1]) && clean[0] !== clean[1];
            }
        },
        {
            section: "Part 5: Quadratics",
            text: "18. Describe the graph y = -2x^2 + 4.\nIs it a Maximum or Minimum?",
            instruction: "Type Maximum or Minimum.",
            blanksCount: 1,
            validator: (ans) => {
                const c = ans[0].toLowerCase().replace(/\s+/g, '');
                return c === 'maximum';
            }
        },
        {
            section: "Part 6: Exponential Functions",
            text: "19. Identify whether this represents growth or decay:\ny = 500(0.8)^x",
            instruction: "Type Growth or Decay.",
            blanksCount: 1,
            validator: (ans) => {
                const c = ans[0].toLowerCase().replace(/\s+/g, '');
                return c === 'decay';
            }
        },
        {
            section: "Part 6: Exponential Functions",
            text: "20. A population doubles every 5 years. Is this linear or exponential?",
            instruction: "Type Linear or Exponential.",
            blanksCount: 1,
            validator: (ans) => {
                const c = ans[0].toLowerCase().replace(/\s+/g, '');
                return c === 'exponential';
            }
        },
        {
            section: "Part 6: Exponential Functions",
            text: "21. Evaluate y = 3(2)^x when x = 4.",
            instruction: "Enter numerical value.",
            blanksCount: 1,
            validator: (ans) => {
                const c = ans[0].toLowerCase().replace(/\s+/g, '');
                return c === '48';
            }
        },
        {
            section: "Part 7: Rational Expressions",
            text: "22. Simplify:\n(x^2 - 9) / (x + 3)",
            instruction: "Enter simplified expression (e.g., x-3).",
            blanksCount: 1,
            validator: (ans) => {
                const c = ans[0].toLowerCase().replace(/\s+/g, '');
                return c === 'x-3';
            }
        },
        {
            section: "Part 7: Rational Expressions",
            text: "23. State the restriction for:\n4 / (x - 5)",
            instruction: "Enter restriction equation format (e.g., x!=5, x!=5, or x not equal to 5).",
            blanksCount: 1,
            validator: (ans) => {
                const c = ans[0].toLowerCase().replace(/\s+/g, '');
                return c === 'x!=5' || c === 'x\u22605' || c === 'x=5'; // x cannot equal 5, accept common representations
            }
        },
        {
            section: "Part 7: Rational Expressions",
            text: "24. Solve:\nx / 3 = 8",
            instruction: "Enter numerical value for x.",
            blanksCount: 1,
            validator: (ans) => {
                const c = ans[0].toLowerCase().replace(/\s+/g, '');
                return c === '24' || c === 'x=24';
            }
        },
        {
            section: "Part 8: Geometry",
            text: "25. Triangle A has sides 3, 5, 7. Similar Triangle B has a scale factor of 2. Enter the longest side of Triangle B.",
            instruction: "Enter the numerical value.",
            blanksCount: 1,
            validator: (ans) => {
                const c = ans[0].toLowerCase().replace(/\s+/g, '');
                return c === '14';
            }
        },
        {
            section: "Part 8: Geometry",
            text: "26. Point (3, -4) is reflected across the x-axis. What is the new point?",
            instruction: "Enter coordinate pair format (e.g., (3,4)).",
            blanksCount: 1,
            validator: (ans) => {
                const c = ans[0].toLowerCase().replace(/\s+/g, '');
                return c === '(3,4)';
            }
        },
        {
            section: "Part 8: Geometry",
            text: "27. Find the distance between (1, 2) and (5, 5).",
            instruction: "Enter numerical distance value.",
            blanksCount: 1,
            validator: (ans) => {
                const c = ans[0].toLowerCase().replace(/\s+/g, '');
                return c === '5';
            }
        },
        {
            section: "Part 9: Trigonometry",
            text: "28. A right triangle has Opposite side = 6 and Adjacent side = 8. Find tan(theta).",
            instruction: "Enter decimal or simplified fraction (e.g., 0.75 or 3/4).",
            blanksCount: 1,
            validator: (ans) => {
                const c = ans[0].toLowerCase().replace(/\s+/g, '');
                return c === '0.75' || c === '3/4';
            }
        },
        {
            section: "Part 9: Trigonometry",
            text: "29. A ladder is 10 feet long and reaches 8 feet up a wall. Find the angle with the ground (round to nearest tenth if necessary, or enter arcsin expression).",
            instruction: "Enter value (e.g., 53.1 or 53.13).",
            blanksCount: 1,
            validator: (ans) => {
                const c = ans[0].toLowerCase().replace(/\s+/g, '');
                // Allow close roundings for 53.13 degrees
                return c === '53.1' || c === '53.13' || c === '53';
            }
        },
        {
            section: "Part 10: Statistics",
            text: "30. Given data set: 4, 7, 8, 10, 11\nFind the Median.",
            instruction: "Enter the median value.",
            blanksCount: 1,
            validator: (ans) => {
                const c = ans[0].toLowerCase().replace(/\s+/g, '');
                return c === '8';
            }
        }
    ];

    let currentQuestionIndex = 0;
    let correctCount = 0;

    const questionTextEl = document.getElementById('questionText');
    const sectionTagEl = document.getElementById('sectionTag');
    const instructionNoteEl = document.getElementById('instructionNote');
    const inputsContainerEl = document.getElementById('inputsContainer');
    const progressLabelEl = document.getElementById('progressLabel');
    const remainingLabelEl = document.getElementById('remainingLabel');
    const progressBarFillEl = document.getElementById('progressBarFill');
    const quizContentEl = document.getElementById('quizContent');
    const resultsContainerEl = document.getElementById('resultsContainer');
    const resultsSummaryEl = document.getElementById('resultsSummary');
    const progressSectionEl = document.getElementById('progressSection');

    function loadQuestion() {
        const q = questions[currentQuestionIndex];
        sectionTagEl.innerText = q.section;
        questionTextEl.innerText = q.text;
        instructionNoteEl.innerText = q.instruction;
        
        // Clear previous inputs
        inputsContainerEl.innerHTML = '';

        // Generate dynamic blanks
        for (let i = 0; i < q.blanksCount; i++) {
            const group = document.createElement('div');
            group.className = 'input-group';
            
            const label = document.createElement('label');
            if (q.blanksCount > 1) {
                label.innerText = i === 0 ? 'Value 1:' : 'Value 2:';
            } else {
                label.innerText = 'Answer:';
            }
            
            const input = document.createElement('input');
            input.type = 'text';
            input.placeholder = 'Type solution...';
            input.dataset.index = i;
            
            group.appendChild(label);
            group.appendChild(input);
            inputsContainerEl.appendChild(group);
        }

        updateProgress();
    }

    function updateProgress() {
        const total = questions.length;
        const current = currentQuestionIndex + 1;
        const remaining = total - current;

        progressLabelEl.innerText = `Question ${current} of ${total}`;
        remainingLabelEl.innerText = `${remaining} remaining`;
        
        const percentage = (currentQuestionIndex / total) * 100;
        progressBarFillEl.style.width = `${percentage}%`;
    }

    function handleNext() {
        const q = questions[currentQuestionIndex];
        const inputElements = inputsContainerEl.querySelectorAll('input');
        const answers = Array.from(inputElements).map(input => input.value.trim());

        // Validate that fields aren't completely empty
        if (answers.some(a => a === '')) {
            alert('Please fill out all answer blanks before proceeding.');
            return;
        }

        // Check correctness using validator
        const isCorrect = q.validator(answers);
        if (isCorrect) {
            correctCount++;
        }

        currentQuestionIndex++;

        if (currentQuestionIndex < questions.length) {
            loadQuestion();
        } else {
            showResults();
        }
    }

    function showResults() {
        quizContentEl.classList.add('hidden');
        progressSectionEl.classList.add('hidden');
        resultsContainerEl.classList.remove('hidden');

        const total = questions.length;
        progressBarFillEl.style.width = '100%';
        
        resultsSummaryEl.innerHTML = `You answered <strong>${correctCount}</strong> out of <strong>${total}</strong> questions correctly.`;
    }

    function restartQuiz() {
        currentQuestionIndex = 0;
        correctCount = 0;
        resultsContainerEl.classList.add('hidden');
        quizContentEl.classList.remove('hidden');
        progressSectionEl.classList.remove('hidden');
        loadQuestion();
    }

    // Initialize the first question on load
    window.onload = loadQuestion;
</script>

</body>
</html>
