<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Match the Function Family</title><style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f7fb;
    color: #1f2937;
  }
  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 12px 16px 20px;
  }
  h1 {
    text-align: center;
    margin: 0 0 4px;
    font-size: 22px;
  }
  .instructions {
    text-align: center;
    margin: 0 auto 10px;
    max-width: 760px;
    color: #4b5563;
    font-size: 13px;
    line-height: 1.3;
  }
  .set-selector {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 10px;
  }
  .set-btn {
    background: #e5e7eb;
    color: #374151;
    border: none;
    padding: 6px 14px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .set-btn.active {
    background: #7c3aed;
    color: white;
  }
  .toolbar {
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }
  button {
    border: 0;
    border-radius: 6px;
    padding: 7px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    background: #2563eb;
    color: white;
  }
  button.secondary { background: #6b7280; }
  button.hint { background: #7c3aed; }
  button:hover { filter: brightness(0.95); }

  .status {
    text-align: center;
    min-height: 20px;
    margin-bottom: 8px;
    font-weight: 600;
    font-size: 13px;
  }

  .groups-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 12px;
    margin-bottom: 14px;
  }
  .group-column {
    background: white;
    border-radius: 10px;
    padding: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,.06);
    border: 2px solid #d1d5db;
    display: flex;
    flex-direction: column;
    gap: 6px;
    transition: .15s ease;
  }
  .group-column.over {
    border-color: #2563eb;
    background: #eff6ff;
  }
  .column-header {
    text-align: center;
    font-weight: 700;
    color: #1f2937;
    font-size: 14px;
    margin: 0;
  }
  .drop-area {
    min-height: 125px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    background: #f9fafb;
    border: 2px dashed #e5e7eb;
    border-radius: 8px;
    padding: 6px;
  }

  .card-bank-section {
    background: white;
    border-radius: 10px;
    padding: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.06);
    margin-bottom: 10px;
  }
  .card-bank-section h2 {
    margin: 0 0 8px;
    font-size: 15px;
    color: #4b5563;
  }
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 8px;
    min-height: 60px;
    background: #f9fafb;
    border: 2px dashed #e5e7eb;
    border-radius: 8px;
    padding: 8px;
  }

  .card {
    background: #eef2ff;
    border: 2px solid #c7d2fe;
    border-radius: 8px;
    padding: 6px 8px;
    min-height: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    cursor: grab;
    user-select: none;
    touch-action: none;
    font-size: 13px;
    font-weight: 600;
    transition: background 0.2s, border-color 0.2s;
  }
  .card:active { cursor: grabbing; }
  .card.dragging { opacity: .45; }
  .card.selected {
    outline: 3px solid #7c3aed;
    background: #ede9fe;
  }
  .card.graph-card {
    min-height: 65px;
    padding: 3px;
  }
  .graph-placeholder {
    width: 100%;
    height: 55px;
    border-radius: 4px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fff;
  }
  .graph-placeholder img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  /* Card Feedback Highlights */
  .card.correct-card {
    background: #f0fdf4 !important;
    border-color: #16a34a !important;
    color: #15803d !important;
  }
  .card.incorrect-card {
    background: #fef2f2 !important;
    border-color: #dc2626 !important;
    color: #b91c1c !important;
  }

  .feedback {
    min-height: 16px;
    text-align: center;
    font-weight: 700;
    font-size: 12px;
  }
  .correct { color: #15803d; }
  .incorrect { color: #b91c1c; }

  .hint-box {
    max-width: 850px;
    margin: 0 auto 10px;
    background: #f5f3ff;
    border: 1px solid #ddd6fe;
    border-radius: 8px;
    padding: 10px 14px;
    display: none;
    font-size: 13px;
    line-height: 1.4;
  }
  .hint-box.show { display: block; }

  @media (max-width: 768px) {
    h1 { font-size: 20px; }
    .cards { grid-template-columns: 1fr 1fr; }
  }</style></head><body><div class="container">
  <h1>Match the Function Family</h1>
  <p class="instructions">
    Arrange the cards into the correct function family columns (Graph, Parent Function, and General Form belonging to the same family).
  </p>

  <div class="set-selector">
    <button class="set-btn active" onclick="switchSet(0)">Set 1 (Basic)</button>
    <button class="set-btn" onclick="switchSet(1)">Set 2 (Advanced)</button>
  </div>

  <div class="toolbar">
    <button id="checkBtn">Check Answer</button>
    <button id="resetBtn" class="secondary">Reset</button>
    <button id="hintBtn" class="hint">Show Hint</button>
  </div>

  <div id="hintBox" class="hint-box">
    <strong>Hint:</strong> Look closely at domain constraints (like square roots and logarithms) and symmetry features.
  </div>

  <div id="status" class="status"></div>

  <!-- Columns for Grouping -->
  <section class="groups-container" id="groupsContainer"></section>

  <!-- Unassigned Card Bank -->
  <section class="card-bank-section">
    <h2>Unassigned Cards</h2>
    <div id="cardBank" class="cards"></div>
  </section></div><script>const functionSetsGroup = [
  [
    {
      id: "linear",
      name: "Linear",
      parent: "y = x",
      general: "y = mx + b",
      graphImg: "images/linear-graph.png"
    },
    {
      id: "rational-even",
      name: "Rational (Even)",
      parent: "y = 1/x²",
      general: "y = a/(x − h)² + k",
      graphImg: "images/rational-even-graph.png"
    },
    {
      id: "rational-odd",
      name: "Rational (Odd)",
      parent: "y = 1/x",
      general: "y = a/(x − h) + k",
      graphImg: "images/rational-odd-graph.png"
    },
    {
      id: "quadratic",
      name: "Quadratic",
      parent: "y = x²",
      general: "y = a(x − h)² + k",
      graphImg: "images/quadratic-graph.png"
    },
    {
      id: "exponential",
      name: "Exponential",
      parent: "y = bˣ",
      general: "y = abˣ⁻ʰ + k",
      graphImg: "images/exponential-graph.png"
    }
  ],
  [
    {
      id: "cubic",
      name: "Cubic",
      parent: "y = x³",
      general: "y = a(x − h)³ + k",
      graphImg: "images/cubic-graph.png"
    },
    {
      id: "cuberoot",
      name: "Cube Root",
      parent: "y = ∛x",
      general: "y = a∛(x − h) + k",
      graphImg: "images/cuberoot-graph.png"
    },
    {
      id: "absolute-value",
      name: "Absolute Value",
      parent: "y = |x|",
      general: "y = a|x − h| + k",
      graphImg: "images/absolute-value-graph.png"
    },
    {
      id: "logarithmic",
      name: "Logarithmic",
      parent: "y = log_b(x)",
      general: "y = a log_b(x − h) + k",
      graphImg: "images/logarithmic-graph.png"
    },
    {
      id: "squareroot",
      name: "Square Root",
      parent: "y = √x",
      general: "y = a√(x − h) + k",
      graphImg: "images/squareroot-graph.png"
    }
  ]
];

let currentSetIndex = 0;
let cards = [];
let selectedCard = null;

function makeCards() {
  cards = [];
  const currentSets = functionSetsGroup[currentSetIndex];
  currentSets.forEach(set => {
    cards.push({
      id: set.id + "-graph",
      type: "graph",
      set: set.id,
      imgSrc: set.graphImg
    });
    cards.push({
      id: set.id + "-parent",
      type: "parent",
      set: set.id,
      label: set.parent
    });
    cards.push({
      id: set.id + "-general",
      type: "general",
      set: set.id,
      label: set.general
    });
  });

  // Fisher-Yates shuffle
  for (let i = cards.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [cards[i], cards[j]] = [cards[j], cards[i]];
  }
}

function createCard(card) {
  const el = document.createElement("div");
  el.className = "card" + (card.type === "graph" ? " graph-card" : "");
  el.draggable = true;
  el.dataset.cardId = card.id;
  el.dataset.set = card.set;
  el.dataset.type = card.type;

  if (card.type === "graph") {
    const placeholder = document.createElement("div");
    placeholder.className = "graph-placeholder";
    const img = document.createElement("img");
    img.src = card.imgSrc;
    img.alt = "Graph";
    placeholder.appendChild(img);
    el.appendChild(placeholder);
  } else {
    el.textContent = card.label;
  }

  el.addEventListener("dragstart", e => {
    e.dataTransfer.setData("text/plain", card.id);
    e.dataTransfer.effectAllowed = "move";
    el.classList.add("dragging");
  });

  el.addEventListener("dragend", () => {
    el.classList.remove("dragging");
  });

  el.addEventListener("click", (e) => {
    e.stopPropagation();
    document.querySelectorAll(".card.selected").forEach(x => x.classList.remove("selected"));
    el.classList.add("selected");
    selectedCard = card.id;
  });

  return el;
}

function render() {
  const bank = document.getElementById("cardBank");
  const groupsContainer = document.getElementById("groupsContainer");
  bank.innerHTML = "";
  groupsContainer.innerHTML = "";

  cards.forEach(card => bank.appendChild(createCard(card)));

  const currentSets = functionSetsGroup[currentSetIndex];
  currentSets.forEach(set => {
    const column = document.createElement("div");
    column.className = "group-column";
    column.dataset.set = set.id;

    const title = document.createElement("h3");
    title.className = "column-header";
    title.textContent = set.name;
    column.appendChild(title);

    const dropArea = document.createElement("div");
    dropArea.className = "drop-area";
    column.appendChild(dropArea);

    const feedback = document.createElement("div");
    feedback.className = "feedback";
    column.appendChild(feedback);

    column.addEventListener("dragover", e => {
      e.preventDefault();
      column.classList.add("over");
    });

    column.addEventListener("dragleave", () => column.classList.remove("over"));

    column.addEventListener("drop", e => {
      e.preventDefault();
      column.classList.remove("over");
      const id = e.dataTransfer.getData("text/plain");
      moveCard(id, dropArea);
    });

    column.addEventListener("click", () => {
      if (selectedCard) {
        moveCard(selectedCard, dropArea);
        selectedCard = null;
      }
    });

    groupsContainer.appendChild(column);
  });

  bank.addEventListener("dragover", e => e.preventDefault());
  bank.addEventListener("drop", e => {
    e.preventDefault();
    const id = e.dataTransfer.getData("text/plain");
    moveCard(id, bank);
  });
  bank.addEventListener("click", () => {
    if (selectedCard) {
      moveCard(selectedCard, bank);
      selectedCard = null;
    }
  });
}

function moveCard(cardId, targetContainer) {
  const cardEl = document.querySelector(`[data-card-id="${cardId}"]`);
  if (!cardEl) return;

  cardEl.classList.remove("correct-card", "incorrect-card");
  targetContainer.appendChild(cardEl);
  cardEl.classList.remove("selected");
  document.getElementById("status").textContent = "";
}

function switchSet(index) {
  currentSetIndex = index;
  document.querySelectorAll(".set-btn").forEach((btn, idx) => {
    if (idx === index) btn.classList.add("active");
    else btn.classList.remove("active");
  });
  resetActivity();
}

function checkAnswer() {
  let correctColumns = 0;
  let allFilled = true;

  document.querySelectorAll(".group-column").forEach(column => {
    const targetSet = column.dataset.set;
    const children = [...column.querySelector(".drop-area").children];
    const feedback = column.querySelector(".feedback");

    if (children.length !== 3) {
      allFilled = false;
      feedback.textContent = children.length === 0 ? "" : "Need 3 cards";
      feedback.className = "feedback incorrect";
      children.forEach(card => card.classList.remove("correct-card", "incorrect-card"));
      return;
    }

    let columnAllCorrect = true;
    children.forEach(card => {
      if (card.dataset.set === targetSet) {
        card.classList.add("correct-card");
        card.classList.remove("incorrect-card");
      } else {
        card.classList.add("incorrect-card");
        card.classList.remove("correct-card");
        columnAllCorrect = false;
      }
    });

    if (columnAllCorrect) {
      correctColumns++;
      feedback.textContent = "Correct!";
      feedback.className = "feedback correct";
    } else {
      feedback.textContent = "Contains errors";
      feedback.className = "feedback incorrect";
    }
  });

  const status = document.getElementById("status");

  if (!allFilled) {
    status.textContent = "Please place exactly 3 cards into each of the 5 columns before checking.";
    status.className = "status incorrect";
  } else if (correctColumns === 5) {
    status.textContent = "Fantastic! All 5 columns are correctly matched function families.";
    status.className = "status correct";
  } else {
    status.textContent = `${correctColumns} of 5 columns are fully correct. Review the highlighted cards and try again.`;
    status.className = "status incorrect";
  }
}

function resetActivity() {
  makeCards();
  render();
  document.getElementById("status").textContent = "";
  document.getElementById("hintBox").classList.remove("show");
  selectedCard = null;
}

document.getElementById("checkBtn").addEventListener("click", checkAnswer);
document.getElementById("resetBtn").addEventListener("click", resetActivity);
document.getElementById("hintBtn").addEventListener("click", () => {
  document.getElementById("hintBox").classList.toggle("show");
});

makeCards();
render();
</script></body></html>
