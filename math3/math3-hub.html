<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math 3</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: transparent;
            color: #333333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        .container {
            background-color: transparent;
            padding: 20px;
            width: 100%;
            max-width: 600px;
            text-align: center;
            box-shadow: none;
        }

        h1 {
            color: #222222;
            margin-top: 0;
        }

        /* 3-Column Grid Layout for buttons */
        .button-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 20px;
            margin-bottom: 30px;
        }

        /* Main Dashboard Button Style */
        .dashboard-button {
            background-color: #00838f;
            color: #ffffff;
            padding: 15px 10px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            transition: background-color 0.2s;
        }

        .dashboard-button:hover {
            background-color: #005f6b;
        }

        .back-button {
            display: inline-block;
            padding: 10px 15px;
            background-color: #333333;
            color: #ffffff;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }

        .back-button:hover {
            background-color: #555555;
        }
    </style>
</head>
<body>

    <div class="container">

            <!-- Topic -->
