<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math 3</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #F07167; /* Same warm coral background */
            color: #333333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
        }

        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 600px;
            text-align: center;
        }

        h1 {
            color: #222222;
            margin-top: 0;
        }

        /* 3-Column Grid Layout for buttons */
        .button-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 20px;
            margin-bottom: 30px;
        }

        /* Main Dashboard Button Style */
        .dashboard-button {
            background-color: #00838f;
            color: #ffffff;
            padding: 15px 10px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            transition: background-color 0.2s;
        }

        .dashboard-button:hover {
            background-color: #005f6b;
        }

        .back-button {
            display: inline-block;
            padding: 10px 15px;
            background-color: #333333;
            color: #ffffff;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }

        .back-button:hover {
            background-color: #555555;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Integrated MATH 3</h1>
        
        <!-- 3-Column Grid Container -->
        <div class="button-grid">
            <button class="dashboard-button" onclick="location.href='math2-diagnostic.html'">
                Diagnostic
            </button>

            <!-- Topic -->
            <button class="dashboard-button" onclick="location.href='math2-linear.html'">
                Linear Equations
            </button>

            <!-- Topic -->
            <button class="dashboard-button" onclick="location.href='math2-functions.html'">
                Functions
            </button>

            <!-- Topic -->
            <button class="dashboard-button" onclick="location.href='math2-systems.html'">
                Systems of Equations
            </button>

            <!-- Topic -->
            <button class="dashboard-button" onclick="location.href='math2-quadratic.html'">
                Quadratic Functions
            </button>

            <!-- Topic -->
            <button class="dashboard-button" onclick="location.href='math2-exponential.html'">
                Exponential Functions
            </button>

            <!-- Topic -->
            <button class="dashboard-button" onclick="location.href='math2-polynomial.html'">
                Polynomial Operations
            </button>

            <!-- Topic -->
            <button class="dashboard-button" onclick="location.href='math2-rational.html'">
                Rational Functions
            </button>

            <!-- Topic -->
            <button class="dashboard-button" onclick="location.href='math2-geometry.html'">
                Geometry & Similarity
            </button>

            <!-- Topic -->
            <button class="dashboard-button" onclick="location.href='math2-trigonometry.html'">
                Trigonometry
            </button>

            <!-- Topic -->
            <button class="dashboard-button" onclick="location.href='math2-statistics.html'">
                Statistics
            </button>
            
            <!-- Future buttons added here will automatically fill the 2nd and 3rd columns -->
        </div>

        <!-- This button links back to your main dashboard -->
         <button class="back-button" onclick="location.href='../index.html'">← Main Dashboard</button>
    </div>

</body>
</html>
