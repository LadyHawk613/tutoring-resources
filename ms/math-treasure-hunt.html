<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math Treasure Hunt</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #102a43, #243b53);
    color: white;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .game {
    width: min(900px, 94vw);
    background: #f7f9fc;
    color: #172b4d;
    border-radius: 24px;
    padding: 28px;
    box-shadow: 0 15px 40px rgba(0,0,0,.35);
    text-align: center;
  }
  h1 { margin: 0 0 8px; font-size: 2.4rem; }
  .subtitle { margin-bottom: 20px; color: #52606d; }
  .stats {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }
  .stat {
    background: #e9eff7;
    border-radius: 14px;
    padding: 10px 18px;
    font-weight: bold;
    flex: 1;
    min-width: 130px;
  }
  .map {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin: 12px 0 22px;
  }
  .key {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: #cbd5e1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.2rem;
  }
  .key.found { background: #f6c945; }
  .challenge {
    background: white;
    border: 3px solid #d9e2ec;
    border-radius: 18px;
    padding: 25px;
  }
  .category {
    color: #486581;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-size: .9rem;
  }
  .question {
    font-size: 2.2rem;
    font-weight: bold;
    margin: 18px 0;
  }
  input {
    width: min(280px, 80%);
    font-size: 1.6rem;
    padding: 12px;
    border: 3px solid #9fb3c8;
    border-radius: 12px;
    text-align: center;
  }
  button {
    border: 0;
    border-radius: 12px;
    padding: 13px 24px;
    font-size: 1.05rem;
    font-weight: bold;
    cursor: pointer;
    margin: 10px 5px 0;
    background: #1677ff;
    color: white;
  }
  button:hover { transform: translateY(-1px); }
  .feedback {
    min-height: 34px;
    margin-top: 14px;
    font-weight: bold;
    font-size: 1.1rem;
  }
  .correct { color: #168a45; }
  .wrong { color: #c92a2a; }
  .treasure {
    display: none;
    padding: 30px 10px;
  }
  .chest {
    font-size: 5rem;
    animation: bounce 1s infinite alternate;
  }
  @keyframes bounce {
    to { transform: translateY(-10px); }
  }
  .final-score { font-size: 1.4rem; font-weight: bold; }
  .restart { background: #f6a800; color: #172b4d; }
</style>
</head>
<body>
<div class="game">
  <h1>🏴‍☠️ Math Treasure Hunt</h1>
  <div class="subtitle">Solve the challenges. Find all 8 treasure keys!</div>

  <div class="stats">
    <div class="stat">⭐ Score: <span id="score">0</span></div>
    <div class="stat">🗝️ Keys: <span id="keys">0</span>/8</div>
    <div class="stat">🔥 Streak: <span id="streak">0</span></div>
  </div>

  <div class="map" id="map"></div>

  <div class="challenge" id="challenge">
    <div class="category" id="category"></div>
    <div class="question" id="question"></div>
    <input id="answer" type="text" autocomplete="off" aria-label="Your answer">
    <br>
    <button id="submit">Unlock the Key!</button>
    <div class="feedback" id="feedback"></div>
  </div>

  <div class="treasure" id="treasure">
    <div class="chest">🧰</div>
    <h2>Treasure Found!</h2>
    <p class="final-score">You collected all 8 keys!</p>
    <p>Your final score: <span id="finalScore"></span> ⭐</p>
    <button class="restart" onclick="restartGame()">Play Again</button>
  </div>
</div>

<script>
const challenges = [
  {cat:"Addition", q:"2,486 + 1,357 = ?", a:"3843"},
  {cat:"Multiplication", q:"7 × 8 = ?", a:"56"},
  {cat:"Division", q:"72 ÷ 9 = ?", a:"8"},
  {cat:"Rounding", q:"Round 4,672 to the nearest hundred.", a:"4700"},
  {cat:"Fractions", q:"Which is greater: 3/4 or 2/4?", a:"3/4"},
  {cat:"Area", q:"A rectangle is 6 units long and 4 units wide. What is its area?", a:"24"},
  {cat:"Subtraction", q:"5,000 − 2,736 = ?", a:"2264"},
  {cat:"Fractions", q:"What fraction is equal to 2/4?", a:"1/2"}
];

let index = 0, score = 0, streak = 0;

const scoreEl = document.getElementById("score");
const keysEl = document.getElementById("keys");
const streakEl = document.getElementById("streak");
const mapEl = document.getElementById("map");
const categoryEl = document.getElementById("category");
const questionEl = document.getElementById("question");
const answerEl = document.getElementById("answer");
const feedbackEl = document.getElementById("feedback");
const challengeEl = document.getElementById("challenge");
const treasureEl = document.getElementById("treasure");

function makeMap() {
  mapEl.innerHTML = "";
  for (let i = 0; i < 8; i++) {
    const key = document.createElement("div");
    key.className = "key" + (i < index ? " found" : "");
    key.textContent = i < index ? "🔑" : "?";
    mapEl.appendChild(key);
  }
}

function loadChallenge() {
  const c = challenges[index];
  categoryEl.textContent = c.cat;
  questionEl.textContent = c.q;
  answerEl.value = "";
  feedbackEl.textContent = "";
  feedbackEl.className = "feedback";
  answerEl.focus();
  makeMap();
}

function normalize(s) {
  return s.trim().toLowerCase().replace(/,/g, "");
}

function checkAnswer() {
  if (answerEl.disabled) return;
  const c = challenges[index];

  if (normalize(answerEl.value) === normalize(c.a)) {
    streak++;
    score += 100 + (streak - 1) * 25;
    index++;
    scoreEl.textContent = score;
    keysEl.textContent = index;
    streakEl.textContent = streak;
    feedbackEl.textContent = "🔓 Correct! You found a treasure key!";
    feedbackEl.className = "feedback correct";
    answerEl.disabled = true;

    setTimeout(() => {
      if (index >= challenges.length) {
        challengeEl.style.display = "none";
        treasureEl.style.display = "block";
        document.getElementById("finalScore").textContent = score;
      } else {
        answerEl.disabled = false;
        loadChallenge();
      }
    }, 800);
  } else {
    streak = 0;
    streakEl.textContent = streak;
    feedbackEl.textContent = "Not quite! Try again.";
    feedbackEl.className = "feedback wrong";
    answerEl.select();
  }
}

document.getElementById("submit").addEventListener("click", checkAnswer);
answerEl.addEventListener("keydown", e => {
  if (e.key === "Enter") checkAnswer();
});

function restartGame() {
  index = 0;
  score = 0;
  streak = 0;
  scoreEl.textContent = "0";
  keysEl.textContent = "0";
  streakEl.textContent = "0";
  treasureEl.style.display = "none";
  challengeEl.style.display = "block";
  loadChallenge();
}

loadChallenge();
</script>
</body>
</html>
