<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math 2</title>
       <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #F07167; /* Same warm coral background */
            color: #333333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
        }

        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 800px; /* Widened to comfortably fit 3 columns */
            text-align: center;
        }

        h1 {
            color: #222222;
            margin-top: 0;
        }

        /* Grid container for activity buttons: 3 columns wide */
        .activity-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin: 20px 0;
        }

        .activity-button {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 15px;
            background-color: #007EA7; /* A nice blue color */
            color: #ffffff;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1em;
            text-align: center;
            min-height: 60px;
            box-sizing: border-box;
        }

        .activity-button:hover {
            background-color: #005f7f;
        }
        
        .back-button {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 15px;
            background-color: #333333;
            color: #ffffff;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }

        .back-button:hover {
            background-color: #555555;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>MATH 2</h1>
        <p>Welcome to the Math 2 section!</p>
        
        <!-- This button links back to your main dashboard -->
        <button class="back-btn" onclick="location.href='../index.html'">← Main Dashboard</button>

        <!-- Diagnostic -->
        <div class="card">
          <button onclick="location.href='math2-diagnostic.html'">
            Diagnostic
          </button>
        </div>
    </div>

</body>
</html>
