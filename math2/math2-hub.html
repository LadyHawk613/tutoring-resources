<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math 2</title>

    <!-- Import the hand-drawn chalk style font from Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cabin+Sketch:wght@700&display=swap" rel="stylesheet">
    
       <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: tranparent;
            color: #333333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
        }

        .container {
            background-color: transparent;
            padding: 30px;
            border-radius: 12px;
            box-shadow: none;
            width: 100%;
            max-width: 800px; /* Widened to comfortably fit 3 columns */
            text-align: center;
        }

         h1 {
            font-family: 'Cabin Sketch', cursive, sans-serif;
            color: #F07167;
            font-size: 36px;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-top: 0;
            margin-bottom: 25px;
        }

        /* Grid container for activity buttons: 3 columns wide */
        .activity-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin: 20px 0;
        }

        .activity-button {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 15px;
            background-color: #007EA7; /* A nice blue color */
            color: #ffffff;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1em;
            text-align: center;
            min-height: 60px;
            box-sizing: border-box;
        }

        .activity-button:hover {
            background-color: #005f7f;
        }
        
    </style>
</head>
<body>

    <div class="container">
        <h1>Integrated MATH 2 Activities</h1>
        
        <!-- 3-Column Grid Container -->
        <div class="button-grid">
            <button class="dashboard-button" onclick="location.href='math2-diagnostic.html'">
                Diagnostic
            </button>

            <!-- Topic -->
            <button class="dashboard-button" onclick="location.href='math2-linear.html'">
                Linear Equations
            </button>

            <!-- Topic -->
            <button class="dashboard-button" onclick="location.href='math2-functions.html'">
                Functions
            </button>

            <!-- Topic -->
            <button class="dashboard-button" onclick="location.href='math2-systems.html'">
                Systems of Equations
            </button>

            <!-- Topic -->
            <button class="dashboard-button" onclick="location.href='math2-quadratic.html'">
                Quadratic Functions
            </button>

            <!-- Topic -->
            <button class="dashboard-button" onclick="location.href='math2-exponential.html'">
                Exponential Functions
            </button>

            <!-- Topic -->
            <button class="dashboard-button" onclick="location.href='math2-polynomial.html'">
                Polynomial Operations
            </button>

            <!-- Topic -->
            <button class="dashboard-button" onclick="location.href='math2-rational.html'">
                Rational Functions
            </button>

            <!-- Topic -->
            <button class="dashboard-button" onclick="location.href='math2-geometry.html'">
                Geometry & Similarity
            </button>

            <!-- Topic -->
            <button class="dashboard-button" onclick="location.href='math2-trigonometry.html'">
                Trigonometry
            </button>

            <!-- Topic -->
            <button class="dashboard-button" onclick="location.href='math2-statistics.html'">
                Statistics
            </button>
            
            <!-- Future buttons added here will automatically fill the 2nd and 3rd columns -->
        </div>

    </div>

</body>
</html>
