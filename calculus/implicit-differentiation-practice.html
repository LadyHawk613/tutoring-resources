<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Practice Template</title>
    
    <!-- MathJax CDN for rendering equations -->
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        :root {
            --primary: #7c3aed;          /* Purple accent */
            --primary-hover: #6d28d9;    /* Darker purple for hover */
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --step-bg: #f5f3ff;          /* Light purple tint for steps */
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            color: var(--text-main);
            margin-bottom: 5px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        /* Navigation tabs for levels */
        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
        }

        .tab-btn {
            background-color: #e2e8f0;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-muted);
        }

        .tab-btn.active {
            background-color: var(--primary);
            color: white;
        }

        .tab-btn:hover:not(.active) {
            background-color: #cbd5e1;
        }

        /* Level section styling */
        .level-section {
            display: none;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        .level-section.active {
            display: block;
        }

        .level-header {
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        .level-header h2 {
            margin: 0 0 5px 0;
            color: var(--primary);
        }

        .level-header p {
            margin: 0;
            color: var(--text-muted);
        }

        /* Problem cards */
        .problem-card {
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .problem-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .problem-text {
            font-size: 1.15rem;
            font-weight: 500;
        }

        .show-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            white-space: nowrap;
            transition: background-color 0.2s;
        }

        .show-btn:hover {
            background-color: var(--primary-hover);
        }

        /* Toggle solution panel */
        .solution-panel {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out, padding 0.3s ease;
            background-color: var(--step-bg);
            border-radius: 6px;
            margin-top: 0;
            padding: 0 15px;
        }

        .solution-panel.open {
            max-height: 800px;
            margin-top: 15px;
            padding: 15px;
            border: 1px solid #ddd6fe;
        }

        .solution-panel h4 {
            margin: 0 0 10px 0;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #5b21b6;
        }

        .steps-list {
            margin: 0;
            padding-left: 20px;
        }

        .steps-list li {
            margin-bottom: 10px;
        }

        .final-answer {
            margin-top: 12px;
            padding-top: 8px;
            border-top: 1px dashed #ddd6fe;
            font-weight: bold;
            color: #047857;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1 id="lesson-title">Lesson Title</h1>
        <p class="subtitle" id="lesson-subtitle">Lesson Subtitle</p>
    </header>

    <!-- Navigation Tabs -->
    <div class="nav-tabs" id="nav-tabs-container"></div>

    <!-- Dynamic Content Sections Container -->
    <div id="content-container"></div>
</div>

<script>
    // ==========================================
    // LESSON CONFIGURATION (EDIT THIS FOR NEW TOPICS)
    // ==========================================
    const lessonData = {
        title: "Implicit Differentiation Practice",
        subtitle: "Step-by-step interactive problem sets",
        levels: [
            {
                levelNumber: 1,
                tabName: "Level 1: Single Terms",
                headerTitle: "Level 1: Single-Term Practice",
                headerDesc: "Focuses on applying the chain rule tag-along \\(\\dfrac{dy}{dx}\\) to isolated \\(y\\) terms.",
                problems: [
                    {
                        question: "1. \\(\\dfrac{d}{dx}[y^5]\\)",
                        steps: [
                            "Apply standard power rule to the outside function: \\(5y^4\\)",
                            "Multiply immediately by the derivative of the inside function: \\(\\dfrac{dy}{dx}\\)"
                        ],
                        answer: "\\(5y^4 \\dfrac{dy}{dx}\\)"
                    },
                    {
                        question: "2. \\(\\dfrac{d}{dx}[4x^3 - 3y^4]\\)",
                        steps: [
                            "Differentiate the first term normally: \\(\\dfrac{d}{dx}[4x^3] = 12x^2\\)",
                            "Differentiate the second term using the power rule and chain rule: \\(-3(4y^3 \\dfrac{dy}{dx}) = -12y^3 \\dfrac{dy}{dx}\\)"
                        ],
                        answer: "\\(12x^2 - 12y^3 \\dfrac{dy}{dx}\\)"
                    },
                    {
                        question: "3. \\(\\dfrac{d}{dx}[\\sin(y)]\\)",
                        steps: [
                            "Differentiate the outside function (sine becomes cosine): \\(\\cos(y)\\)",
                            "Multiply by the derivative of the inside function: \\(\\dfrac{dy}{dx}\\)"
                        ],
                        answer: "\\(\\cos(y) \\dfrac{dy}{dx}\\)"
                    }
                ]
            },
            {
                levelNumber: 2,
                tabName: "Level 2: Product Rule",
                headerTitle: "Level 2: Product Rule Practice",
                headerDesc: "Focuses on handling expressions where \\(x\\) and \\(y\\) are multiplied together.",
                problems: [
                    {
                        question: "1. Find \\(\\dfrac{dy}{dx}\\) for: \\(x^2y = 5\\)",
                        steps: [
                            "Apply product rule \\((f \\cdot g)' = f'g + fg'\\) to left side: \\((2x)(y) + (x^2)\\left(\\dfrac{dy}{dx}\\)\\)",
                            "Differentiate the right side constant: \\(\\dfrac{d}{dx}[5] = 0\\)",
                            "Set equation: \\(2xy + x^2\\dfrac{dy}{dx} = 0\\)",
                            "Isolate \\(\\dfrac{dy}{dx}\\): \\(x^2\\dfrac{dy}{dx} = -2xy \\implies \\dfrac{dy}{dx} = \\dfrac{-2xy}{x^2}\\)"
                        ],
                        answer: "\\(\\dfrac{dy}{dx} = -\\dfrac{2y}{x}\\)"
                    },
                    {
                        question: "2. Find \\(\\dfrac{dy}{dx}\\) for: \\(xy^2 = 12\\)",
                        steps: [
                            "Apply product rule: \\((1)(y^2) + (x)\\left(2y \\dfrac{dy}{dx}\\) = 0\\)",
                            "Simplify: \\(y^2 + 2xy\\dfrac{dy}{dx} = 0\\)",
                            "Move non-derivative term: \\(2xy\\dfrac{dy}{dx} = -y^2\\)",
                            "Divide to isolate: \\(\\dfrac{dy}{dx} = \\dfrac{-y^2}{2xy}\\)"
                        ],
                        answer: "\\(\\dfrac{dy}{dx} = -\\dfrac{y}{2x}\\)"
                    },
                    {
                        question: "3. Find \\(\\dfrac{dy}{dx}\\) for: \\(3xy - y = 4\\)",
                        steps: [
                            "Differentiate term by term, applying product rule to \\(3xy\\): \\(3\\left(1 \\cdot y + x \\cdot \\dfrac{dy}{dx}\\) - \\dfrac{dy}{dx} = 0\\)",
                            "Expand: \\(3y + 3x\\dfrac{dy}{dx} - \\dfrac{dy}{dx} = 0\\)",
                            "Group \\(\\dfrac{dy}{dx}\\) terms: \\((3x - 1)\\dfrac{dy}{dx} = -3y\\)",
                            "Isolate: \\(\\dfrac{dy}{dx} = \\dfrac{-3y}{3x - 1}\\)"
                        ],
                        answer: "\\(\\dfrac{dy}{dx} = -\\dfrac{3y}{3x - 1}\\)"
                    }
                ]
            },
            {
                levelNumber: 3,
                tabName: "Level 3: Full Equation & Factoring",
                headerTitle: "Level 3: Full Equation & Factoring",
                headerDesc: "Focuses on equations where \\(\\dfrac{dy}{dx}\\) appears on multiple terms and requires algebraic factoring.",
                problems: [
                    {
                        question: "1. Find \\(\\dfrac{dy}{dx}\\) for: \\(x^2 + y^2 = 10\\)",
                        steps: [
                            "Differentiate all terms: \\(2x + 2y\\dfrac{dy}{dx} = 0\\)",
                            "Isolate the derivative term: \\(2y\\dfrac{dy}{dx} = -2x\\)",
                            "Divide both sides by \\(2y\\): \\(\\dfrac{dy}{dx} = \\dfrac{-2x}{2y}\\)"
                        ],
                        answer: "\\(\\dfrac{dy}{dx} = -\\dfrac{x}{y}\\)"
                    },
                    {
                        question: "2. Find \\(\\dfrac{dy}{dx}\\) for: \\(x^3 + y^3 = 3xy\\)",
                        steps: [
                            "Differentiate term by term (using product rule on right side): \\(3x^2 + 3y^2\\dfrac{dy}{dx} = 3\\left(y + x\\dfrac{dy}{dx}\\)\\)",
                            "Expand right side: \\(3x^2 + 3y^2\\dfrac{dy}{dx} = 3y + 3x\\dfrac{dy}{dx}\\)",
                            "Gather all \\(\\dfrac{dy}{dx}\\) terms on the left: \\(3y^2\\dfrac{dy}{dx} - 3x\\dfrac{dy}{dx} = 3y - 3x^2\\)",
                            "Factor out \\(\\dfrac{dy}{dx}\\): \\(\\dfrac{dy}{dx}(3y^2 - 3x) = 3y - 3x^2\\)",
                            "Divide to isolate and simplify: \\(\\dfrac{dy}{dx} = \\dfrac{3y - 3x^2}{3y^2 - 3x}\\)"
                        ],
                        answer: "\\(\\dfrac{dy}{dx} = \\dfrac{y - x^2}{y^2 - x}\\)"
                    },
                    {
                        question: "3. Find \\(\\dfrac{dy}{dx}\\) for: \\(y^2 - 5x = y + x^2\\)",
                        steps: [
                            "Differentiate every term: \\(2y\\dfrac{dy}{dx} - 5 = \\dfrac{dy}{dx} + 2x\\)",
                            "Collect all \\(\\dfrac{dy}{dx}\\) terms on the left side: \\(2y\\dfrac{dy}{dx} - \\dfrac{dy}{dx} = 2x + 5\\)",
                            "Factor out \\(\\dfrac{dy}{dx}\\): \\(\\dfrac{dy}{dx}(2y - 1) = 2x + 5\\)",
                            "Divide to isolate: \\(\\dfrac{dy}{dx} = \\dfrac{2x + 5}{2y - 1}\\)"
                        ],
                        answer: "\\(\\dfrac{dy}{dx} = \\dfrac{2x + 5}{2y - 1}\\)"
                    }
                ]
            }
        ]
    };

    // ==========================================
    // TEMPLATE GENERATOR ENGINE (DO NOT EDIT)
    // ==========================================
    function renderLesson() {
        // Set Header
        document.getElementById('lesson-title').textContent = lessonData.title;
        document.getElementById('lesson-subtitle').textContent = lessonData.subtitle;

        const tabsContainer = document.getElementById('nav-tabs-container');
        const contentContainer = document.getElementById('content-container');

        tabsContainer.innerHTML = '';
        contentContainer.innerHTML = '';

        lessonData.levels.forEach((level, index) => {
            const isActive = index === 0 ? 'active' : '';

            // 1. Create Navigation Tab Button
            const tabBtn = document.createElement('button');
            tabBtn.className = `tab-btn ${isActive}`;
            tabBtn.setAttribute('onclick', `switchLevel(${level.levelNumber})`);
            tabBtn.textContent = level.tabName;
            tabsContainer.appendChild(tabBtn);

            // 2. Create Level Section Page
            const section = document.createElement('section');
            section.id = `level-${level.levelNumber}`;
            section.className = `level-section ${isActive}`;

            let problemsHTML = '';
            level.problems.forEach(prob => {
                let stepsListHTML = prob.steps.map(step => `<li>${step}</li>`).join('');
                
                problemsHTML += `
                    <div class="problem-card">
                        <div class="problem-top">
                            <span class="problem-text">${prob.question}</span>
                            <button class="show-btn" onclick="toggleSolution(this)">Show Answer</button>
                        </div>
                        <div class="solution-panel">
                            <h4>Solution Steps:</h4>
                            <ul class="steps-list">${stepsListHTML}</ul>
                            <div class="final-answer">Answer: ${prob.answer}</div>
                        </div>
                    </div>
                `;
            });

            section.innerHTML = `
                <div class="level-header">
                    <h2>${level.headerTitle}</h2>
                    <p>${level.headerDesc}</p>
                </div>
                ${problemsHTML}
            `;
            contentContainer.appendChild(section);
        });

        // Tell MathJax to typeset the dynamically injected equations
        if (window.MathJax) {
            MathJax.typeset();
        }
    }

    function switchLevel(levelNumber) {
        document.querySelectorAll('.level-section').forEach(sec => sec.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));

        document.getElementById(`level-${levelNumber}`).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    function toggleSolution(button) {
        const card = button.closest('.problem-card');
        const panel = card.querySelector('.solution-panel');
        
        panel.classList.toggle('open');
        
        if (panel.classList.contains('open')) {
            button.textContent = "Hide Answer";
            button.style.backgroundColor = "#5b21b6";
        } else {
            button.textContent = "Show Answer";
            button.style.backgroundColor = "";
        }
    }

    // Run on load
    window.onload = renderLesson;
</script>

</body>
</html>
